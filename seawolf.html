<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sea Wolf - CasEdge</title>
<style>
:root{
 --ink:#f2f6fa; --dim:#a9bccd; --dim2:#7f97ab;
 --card:#ffffff; --cardInk:#101c28;
 --panel:rgba(10,18,26,.78); --hair:rgba(255,255,255,.10);
 --ok:#3fa87a; --bad:#d1685f; --gold:#d8a53c; --acc:#2f7fb8;
 --r:12px; --rl:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#03151f;color:var(--ink);
 font:400 15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
h1,h2,h3,h4{letter-spacing:-.015em;font-weight:600;margin:0}
.mono{font-variant-numeric:tabular-nums lining-nums}

/* ---------- фон: глубина, лучи, зерно ---------- */
#sea{position:fixed;inset:0;z-index:0;transition:background 1.6s ease;
 background:
  radial-gradient(120% 62% at 50% -14%, rgba(120,215,240,.30) 0%, rgba(60,160,200,.16) 26%, transparent 58%),
  linear-gradient(180deg,#1b6d8f 0%,#125a7c 14%,#0b4364 32%,#072f49 54%,#041e30 76%,#02121e 100%)}
body.d1 #sea{background:
  radial-gradient(120% 62% at 50% -14%, rgba(150,235,245,.40) 0%, rgba(80,190,215,.20) 26%, transparent 58%),
  linear-gradient(180deg,#2a86a6 0%,#1a6f92 14%,#105577 32%,#0a3c5c 54%,#06283f 76%,#03192a 100%)}
body.d2 #sea{background:
  radial-gradient(120% 62% at 50% -14%, rgba(110,200,230,.24) 0%, rgba(50,140,185,.13) 26%, transparent 56%),
  linear-gradient(180deg,#13597c 0%,#0e4768 14%,#093551 32%,#062639 54%,#041a29 76%,#020f19 100%)}
body.d3 #sea{background:
  radial-gradient(110% 55% at 50% -18%, rgba(80,165,205,.18) 0%, rgba(35,105,150,.09) 24%, transparent 54%),
  linear-gradient(180deg,#0a3b57 0%,#072d45 14%,#052134 32%,#03182781 54%,#02101c 76%,#010a12 100%)}
body.d1 #snow{opacity:.62} body.d2 #snow{opacity:.5} body.d3 #snow{opacity:.34}
body.d1 #rays{opacity:.19} body.d2 #rays{opacity:.12} body.d3 #rays{opacity:.06}
body.d1 #caust{opacity:.17} body.d2 #caust{opacity:.11} body.d3 #caust{opacity:.05}
body.d3 #vig{background:radial-gradient(120% 82% at 50% 34%,transparent 26%,rgba(0,6,12,.6) 66%,rgba(0,4,8,.86) 100%)}
/* каустика: настоящий шум, а не полоски */
#caust{position:fixed;inset:-12%;z-index:1;pointer-events:none;opacity:.13;mix-blend-mode:screen;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='560' height='560'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='0.011 0.02' numOctaves='3' seed='7'/><feColorMatrix type='matrix' values='0 0 0 0 0.62  0 0 0 0 0.88  0 0 0 0 1  0 0 0 -2.2 1.05'/></filter><rect width='560' height='560' filter='url(%23c)'/></svg>");
 background-size:820px 820px;filter:blur(1.5px);animation:caust 42s linear infinite}
@keyframes caust{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-3%,2%,0) scale(1.06)}100%{transform:translate3d(0,0,0) scale(1)}}
/* лучи света от поверхности */
#rays{position:fixed;inset:-25% -15%;z-index:1;pointer-events:none;opacity:.13;mix-blend-mode:screen;
 background:
  linear-gradient(99deg,transparent 44%,rgba(190,235,255,.75) 47.5%,transparent 51%),
  linear-gradient(93deg,transparent 60%,rgba(190,235,255,.5) 63.5%,transparent 67%),
  linear-gradient(108deg,transparent 20%,rgba(190,235,255,.42) 23.5%,transparent 27%),
  linear-gradient(87deg,transparent 76%,rgba(190,235,255,.32) 79%,transparent 82%);
 filter:blur(30px);animation:ray 46s ease-in-out infinite alternate}
@keyframes ray{from{transform:translate3d(-2%,0,0) rotate(-.4deg)}to{transform:translate3d(3%,1.5%,0) rotate(.5deg)}}
/* морской снег */
#snow{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.5}
#snow span{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(226,244,255,.9),rgba(226,244,255,0) 70%);
 animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translate3d(0,-8vh,0)}100%{transform:translate3d(2vw,108vh,0)}}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;
 background:radial-gradient(125% 88% at 50% 34%,transparent 34%,rgba(0,9,17,.42) 74%,rgba(0,6,12,.72) 100%)}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:3;max-width:1240px;margin:0 auto;padding:18px 22px 48px}

/* ---------- верхняя телеметрия ---------- */
.top{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px}
.tl{flex:1;display:flex;flex-direction:column;gap:9px}
.trow{display:flex;align-items:center;gap:14px}
.lab{width:150px;text-align:right;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.val{font-size:13px;color:var(--ink)}
.tbar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.13);overflow:hidden}
.tfill{height:100%;background:#5fbf95;transition:width .9s linear}
.tfill.warn{background:var(--gold)}.tfill.hot{background:var(--bad)}
.segs{flex:1;display:flex;gap:2px}
.seg{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
.seg.on{background:var(--gold)}.seg.done{background:#5fbf95}
.exit{background:transparent;border:1px solid var(--hair);color:var(--dim);border-radius:20px;padding:7px 16px;font-size:12.5px;cursor:pointer;transition:.15s}
.exit:hover{border-color:rgba(255,255,255,.3);color:var(--ink)}

/* ---------- сцена ---------- */
.stage{display:grid;grid-template-columns:1fr 276px;gap:26px;align-items:start}
@media(max-width:960px){.stage{grid-template-columns:1fr}}
.sechead{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);margin:0 0 12px}

/* ---------- карточки предложений ---------- */
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:30px}
@media(max-width:800px){.offers{grid-template-columns:1fr}}
.ocard{background:var(--card);border-radius:var(--rl);padding:18px 18px 16px;color:var(--cardInk);
 position:relative;cursor:pointer;
 box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 6px rgba(0,20,35,.18), 0 14px 34px rgba(0,15,28,.34);
 transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s}
.ocard:hover{transform:translateY(-4px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 4px 10px rgba(0,20,35,.2),0 22px 46px rgba(0,15,28,.44)}
.ocard:active{transform:translateY(-1px) scale(.995)}
.ocard.picked{box-shadow:0 0 0 2px var(--gold),0 20px 44px rgba(0,15,28,.44)}
.ocard .nm{text-align:center;font-weight:600;font-size:16.5px;letter-spacing:-.01em;color:#0d1822}
.ocard .sub{text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8496a6;margin-top:2px}
.ocard .art{display:flex;justify-content:center;margin:10px 0 12px}
.hr{height:1px;background:#e8edf2;margin:2px 0 8px}
.arow{display:flex;align-items:center;gap:11px;padding:5px 0;font-size:14px}
.arow .ico{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;background:#f1f5f8;border-radius:7px}
.arow .an{flex:1;color:#4a5b6c;font-size:13.5px}
.arow .av{font-weight:650;color:#0d1822;font-size:15px}
.trow2{display:flex;align-items:center;gap:11px;padding:9px 0 0;margin-top:6px;border-top:1px solid #e8edf2;font-size:13.5px;color:#33455a}
.plus{position:absolute;right:14px;bottom:13px;width:32px;height:32px;border-radius:50%;
 background:#0d1822;color:#fff;border:0;cursor:pointer;display:grid;place-items:center;transition:.15s}
.plus:hover{background:var(--acc);transform:scale(1.08)}

/* ---------- пул ---------- */
.pool{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:800px){.pool{grid-template-columns:repeat(2,1fr)}}
.pill{background:var(--card);border-radius:var(--r);padding:22px 10px 11px;color:var(--cardInk);position:relative;
 box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 20px rgba(0,15,28,.28);
 transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s}
.pill.click{cursor:pointer}
.pill.click:hover{transform:translateY(-3px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 14px 30px rgba(0,15,28,.4)}
.pill.sel{box-shadow:0 0 0 2px var(--gold),0 14px 30px rgba(0,15,28,.4)}
.pill .thumb{position:absolute;top:-20px;left:50%;transform:translateX(-50%)}
.pill .nm{text-align:center;font-weight:600;font-size:13px;letter-spacing:-.005em;margin:6px 0 7px;color:#0d1822}
.pill .st{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px}
.pill .st i{display:grid;place-items:center;width:16px;height:16px;opacity:.55}
.pill .st b{color:#0d1822;font-weight:650}
.pill .tr{position:absolute;top:8px;right:9px;opacity:.9}

/* ---------- панель ---------- */
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--rl);
 backdrop-filter:blur(14px) saturate(120%);overflow:hidden}
.panel h3{padding:14px 17px 12px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);
 border-bottom:1px solid var(--hair);font-weight:500}
.panel .body{padding:13px 17px 16px}
.grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin:10px 0 4px}
.grp:first-child{margin-top:0}
.prow{display:flex;align-items:center;gap:12px;padding:7px 0}
.prow+.prow{border-top:1px solid rgba(255,255,255,.055)}
.prow .ico{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;background:rgba(255,255,255,.06);border-radius:8px}
.prow .n{flex:1;font-size:13.5px;color:#dbe8f2}
.prow .v{font-weight:650;font-size:15px}
.tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}

/* ---------- нижняя плашка ---------- */
.bottom{margin-top:30px;display:flex;align-items:center;gap:16px;
 background:rgba(6,14,21,.86);border:1px solid var(--hair);border-radius:var(--rl);padding:14px 18px;backdrop-filter:blur(12px)}
.bottom .i{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1.4px solid var(--gold);color:var(--gold);
 display:grid;place-items:center;font-size:12px;font-weight:700;font-style:italic}
.bottom .txt{flex:1;font-size:13.5px;color:#c9dcea}
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:11px 22px;font-size:14.5px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{background:#3b93cf}.btn[disabled]{background:rgba(255,255,255,.08);color:#6b7f90;cursor:default}
.btn.g{background:#2b7d5c}.btn.g:hover{background:#33936c}
.btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--dim)}
.btn.ghost:hover{border-color:rgba(255,255,255,.3);color:var(--ink)}
.legend{position:fixed;right:22px;bottom:22px;z-index:20;background:rgba(255,255,255,.94);color:#0d1822;border:0;
 border-radius:9px;padding:9px 17px;font-size:13.5px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.4)}

/* ---------- живые бактерии ---------- */
.mb{overflow:visible;will-change:transform}
.mbSpin{transform-box:fill-box;transform-origin:50% 50%;animation:spin var(--dur,18s) linear infinite;animation-direction:var(--dir,normal)}
.mbFloat{transform-box:fill-box;transform-origin:50% 50%;animation:float var(--bob,4s) ease-in-out infinite}
.mbSpikes{transform-box:fill-box;transform-origin:50% 50%;animation:spin calc(var(--dur,18s)*1.7) linear infinite reverse}
.mbCilia{transform-box:fill-box;transform-origin:50% 50%;animation:cilia 2.1s ease-in-out infinite}
.mbFlag{transform-box:fill-box;transform-origin:22% 50%;animation:flag 1.5s ease-in-out infinite}
.mbShadow{animation:shad var(--bob,4s) ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shad{0%,100%{opacity:.3;transform:scaleX(1)}50%{opacity:.18;transform:scaleX(.88)}}
@keyframes cilia{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes flag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.mbSpin,.mbFloat,.mbSpikes,.mbCilia,.mbFlag,.mbShadow{animation:none}}
.ocard .mb,.pill .mb{transition:transform .28s cubic-bezier(.2,.7,.3,1)}
.ocard:hover .mbSpin,.pill.click:hover .mbSpin{animation-duration:calc(var(--dur,18s)/3.4)}
.ocard:hover .mb{transform:scale(1.09)}
.pill.click:hover .mb{transform:scale(1.14)}
.ocard.picked .mbSpin,.pill.sel .mbSpin{animation-duration:calc(var(--dur,18s)/5)}
.ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(20,60,90,.16),transparent 70%);
 transform:translate(-50%,-50%) scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* ---------- модалки ---------- */
.veil{position:fixed;inset:0;z-index:30;background:rgba(2,10,17,.74);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px}
.modal{max-width:740px;width:100%;background:linear-gradient(180deg,rgba(16,38,54,.98),rgba(8,24,36,.98));
 border:1px solid var(--hair);border-radius:20px;padding:34px 38px 28px;box-shadow:0 40px 90px rgba(0,0,0,.6);max-height:88vh;overflow:auto}
.modal .kicker{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.modal h2{font-size:25px;margin:0 0 14px;letter-spacing:-.02em}
.modal p{color:#c9dcea;margin:0 0 13px;font-size:15px}
.modal ul{color:#c9dcea;margin:0 0 13px;padding-left:20px}
.modal li{margin:5px 0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}
@media(max-width:700px){.row3{grid-template-columns:1fr}}
.phase{text-align:center}
.phase .b{width:64px;height:64px;margin:0 auto 10px;border-radius:16px;background:rgba(255,255,255,.06);
 border:1px solid var(--hair);display:grid;place-items:center}
.phase .t{font-size:13px;color:#dbe8f2;font-weight:500}
.phase .d{font-size:11.5px;color:var(--dim2);margin-top:3px}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;align-items:center}
.dots{display:flex;gap:6px;margin-right:auto}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2)}.dot.on{background:var(--gold)}
.note{background:rgba(216,165,60,.10);border-left:2px solid var(--gold);padding:12px 15px;border-radius:0 10px 10px 0;
 color:#e7d5ad;font-size:13px;margin:16px 0}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:640px){.lg{grid-template-columns:1fr}}
.lgrow{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;border-top:1px solid rgba(255,255,255,.055)}
.lgrow .ico{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;background:rgba(255,255,255,.06);border-radius:8px}

/* ---------- титул ---------- */
.hero{max-width:860px;margin:6vh auto 0;text-align:center}
.brand{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim2);margin-bottom:20px}
.hero h1{font-size:52px;letter-spacing:-.035em;font-weight:600;margin:0 0 10px;
 background:linear-gradient(180deg,#ffffff,#a9cbe0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:var(--dim);max-width:560px;margin:0 auto 26px;font-size:16px}
.reef{display:flex;justify-content:center;align-items:flex-end;gap:26px;margin-bottom:6px;height:120px}
.stats{display:flex;gap:34px;justify-content:center;margin-top:26px;color:var(--dim2);font-size:12px;letter-spacing:.06em}
.stats b{display:block;font-size:19px;color:var(--ink);letter-spacing:-.01em;margin-bottom:2px}

/* ---------- разбор ---------- */
.rcard{background:var(--panel);border:1px solid var(--hair);border-radius:var(--rl);padding:22px 24px;margin-bottom:18px;backdrop-filter:blur(12px)}
.rcard h2{font-size:19px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
td,th{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
th{color:var(--dim2);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.ok{color:var(--ok)}.bad{color:var(--bad)}.taken{color:var(--gold);font-weight:600}
.big{font-size:56px;font-weight:600;letter-spacing:-.04em;line-height:1}
.dim{color:var(--dim)}.small{font-size:13px}
</style></head>
<body>
<div id="sea"></div><div id="caust"></div><div id="rays"></div><div id="snow"></div><div id="grain"></div><div id="vig"></div>
<div class="wrap" id="app"></div>
<script>
// данных в клиенте нет — всё приходит с сервера
const ATTRS=['Permeability','Size','Density'], ROUNDS=4, TIMER=30*60*1000;
const TRAITS={
 'Hydrophilic':      {c1:'#8fdcf5',c2:'#2f86ab',c3:'#124a67',ic:'drop',  ru:'Гидрофильный'},
 'Heat Resistant':   {c1:'#f0a882',c2:'#b8563a',c3:'#6d2a1c',ic:'therm', ru:'Термостойкий'},
 'Bioluminescence':  {c1:'#b8e88f',c2:'#4f9646',c3:'#245127',ic:'bulb',  ru:'Биолюминесцентный'},
 'Pressure Resistant':{c1:'#c3aae8',c2:'#6f52a8',c3:'#3a2a5e',ic:'press', ru:'Барорезистентный'}
};
/* Калибровочная строка НЕ дублируется здесь: она приходит с сервера (state.levelNote,
   view.levelNote). Вторая копия этого текста в клиенте — ровно тот дефект, из-за которого
   словарь на сервере разошёлся с уровнями партии и кандидат три сдачи видел undefined. */

/* ================= иконки ================= */
function icon(kind,size,col){
 const s=size||18,c=col||'#5b6d7e',sw=1.5;
 const P={
  perm:`<circle cx="12" cy="12" r="8" fill="none" stroke="${c}" stroke-width="${sw}"/><path d="M12 4v16M4.6 9h14.8M4.6 15h14.8" stroke="${c}" stroke-width="${sw*.75}" opacity=".8"/>`,
  size:`<path d="M4 12h16" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/><path d="M7.5 8.5 4 12l3.5 3.5M16.5 8.5 20 12l-3.5 3.5" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`,
  dens:`<circle cx="9" cy="9" r="1.7" fill="${c}"/><circle cx="15" cy="8" r="1.3" fill="${c}"/><circle cx="16" cy="14.5" r="1.9" fill="${c}"/><circle cx="9.5" cy="15.5" r="1.5" fill="${c}"/><circle cx="12.5" cy="11.8" r="1.1" fill="${c}"/>`,
  drop:`<path d="M12 3.5c3.3 4.3 5.4 6.9 5.4 9.6a5.4 5.4 0 0 1-10.8 0c0-2.7 2.1-5.3 5.4-9.6z" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"/>`,
  therm:`<path d="M10.2 13.6V5.4a1.8 1.8 0 0 1 3.6 0v8.2a3.6 3.6 0 1 1-3.6 0z" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"/><circle cx="12" cy="16.6" r="1.5" fill="${c}"/>`,
  bulb:`<path d="M12 3.6a4.9 4.9 0 0 0-2.8 8.9c.5.4.8 1 .8 1.6v.6h4v-.6c0-.6.3-1.2.8-1.6A4.9 4.9 0 0 0 12 3.6z" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"/><path d="M10 17.4h4M10.6 19.6h2.8" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`,
  press:`<path d="M6.5 5.5h11M12 8v7.5" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/><path d="M8.5 12.5 12 16l3.5-3.5" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.5 19h11" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`,
  target:`<circle cx="12" cy="12" r="8" fill="none" stroke="${c}" stroke-width="${sw}"/><circle cx="12" cy="12" r="3.6" fill="none" stroke="${c}" stroke-width="${sw}"/><circle cx="12" cy="12" r="1" fill="${c}"/>`,

const ATTR_ICON={Permeability:'perm',Size:'size',Density:'dens'};

/* ================= 3D-микробы (процедурные SVG) ================= */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rnd(seed){let x=seed||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function microbe(name,trait,size){
 const S=size||96, hh=hash(name), R=rnd(hh||7), T=TRAITS[trait]||TRAITS['Hydrophilic'];
 const form=hh%9, id='m'+hh.toString(36), seed=hh%9000;
 const c1=T.c1, c2=T.c2, c3=T.c3||c2;
 const dur=(20+(hh%12)).toFixed(1), dir=(hh>>3)%2?'normal':'reverse', bob=(4.2+((hh>>5)%22)/10).toFixed(1);

 /* ---- органическая поверхность: шум → рельеф → блик ---- */
 const skin = (fid,freq,scale,lx,ly)=>`
  <filter id="${fid}" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="${freq}" numOctaves="4" seed="${seed}" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="${scale}" diffuseConstant="1" lighting-color="#ffffff" result="dl">
      <feDistantLight azimuth="228" elevation="58"/>
    </feDiffuseLighting>
    <feComposite in="dl" in2="SourceGraphic" operator="in" result="dlc"/>
    <feBlend in="SourceGraphic" in2="dlc" mode="multiply" result="base"/>
    <feSpecularLighting in="n" surfaceScale="${scale*1.5}" specularConstant="1.05" specularExponent="26"
       lighting-color="#eaf6ff" result="sp">
      <fePointLight x="${lx}" y="${ly}" z="72"/>
    </feSpecularLighting>
    <feComposite in="sp" in2="SourceGraphic" operator="in" result="spc"/>
    <feBlend in="base" in2="spc" mode="screen"/>
  </filter>`;

 const grad = (gid,cx,cy)=>`
  <radialGradient id="${gid}" cx="${cx}%" cy="${cy}%" r="72%">
    <stop offset="0%"   stop-color="${c1}"/>
    <stop offset="52%"  stop-color="${c2}"/>
    <stop offset="86%"  stop-color="${c3}"/>
    <stop offset="100%" stop-color="#040d14"/>
  </radialGradient>`;

 /* внутренние структуры */
 const nucleus=(x,y,r)=>`<g opacity=".55"><circle cx="${x}" cy="${y}" r="${r}" fill="#04121b" opacity=".5"/>
   <circle cx="${x}" cy="${y}" r="${r*.82}" fill="${c3}" opacity=".85"/>
   <circle cx="${x-r*.28}" cy="${y-r*.3}" r="${r*.3}" fill="#ffffff" opacity=".3"/></g>`;
 const granules=(cx,cy,rad,n)=>{let s='';for(let i=0;i<n;i++){const a=R()*6.283,d=Math.sqrt(R())*rad,
   x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d,r=.9+R()*2.1;
   s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#03101a" opacity="${(.16+R()*.24).toFixed(2)}"/>`;
   s+=`<circle cx="${(x-.5).toFixed(1)}" cy="${(y-.5).toFixed(1)}" r="${(r*.5).toFixed(1)}" fill="#ffffff" opacity="${(.10+R()*.16).toFixed(2)}"/>`}
   return s};
 const rim=(sel)=>`<g opacity=".5" style="mix-blend-mode:screen">${sel}</g>`;

 let defs='', art='', hairs='';

 if(form===0){                                    /* гроздь кокков */
   const n=4;let cells='';const pos=[];
   for(let i=0;i<n;i++){const a=i/n*6.283+.4,d=15+R()*6;pos.push([50+Math.cos(a)*d,50+Math.sin(a)*d,14+R()*5])}
   pos.sort((p,q)=>p[1]-q[1]);
   pos.forEach((pp,i)=>{const[x,y,r]=pp;const g=id+'g'+i;defs+=grad(g,34,28);
     cells+=`<g filter="url(#${id}sk)"><circle cx="${x}" cy="${y}" r="${r}" fill="url(#${g})"/></g>
       <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${c1}" stroke-width="1.1" opacity=".45"/>
       <ellipse cx="${x-r*.34}" cy="${y-r*.38}" rx="${r*.30}" ry="${r*.20}" fill="#fff" opacity=".38" transform="rotate(-28 ${x} ${y})"/>
       ${granules(x,y,r*.6,7)}`});
   defs+=skin(id+'sk',.85,2.2,32,24); art=cells;

 } else if(form===1){                              /* вирион */
   defs+=grad(id+'g',34,26)+skin(id+'sk',1.05,2.6,34,26);
   let sp='';for(let i=0;i<18;i++){const a=i/18*6.283,l=30,L=41+R()*3;
     sp+=`<line x1="${50+Math.cos(a)*l}" y1="${50+Math.sin(a)*l}" x2="${50+Math.cos(a)*L}" y2="${50+Math.sin(a)*L}"
       stroke="${c3}" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>
       <circle cx="${50+Math.cos(a)*(L+1.4)}" cy="${50+Math.sin(a)*(L+1.4)}" r="3.1" fill="${c1}" opacity=".95"/>
       <circle cx="${50+Math.cos(a)*(L+1)}" cy="${50+Math.sin(a)*(L+1)}" r="1.2" fill="#fff" opacity=".45"/>`}
   hairs=`<g class="mbSpikes">${sp}</g>`;
   art=`<g filter="url(#${id}sk)"><circle cx="50" cy="50" r="30" fill="url(#${id}g)"/></g>
     <circle cx="50" cy="50" r="30" fill="none" stroke="${c1}" stroke-width="1.2" opacity=".5"/>
     <ellipse cx="39" cy="37" rx="10" ry="6.5" fill="#fff" opacity=".33" transform="rotate(-28 39 37)"/>
     ${nucleus(56,57,8)}${granules(50,50,24,16)}`;

 } else if(form===2){                              /* спирохета */
   defs+=grad(id+'g',30,26)+skin(id+'sk',1.3,2.2,30,26);
   let d='M12 60 ';for(let i=0;i<5;i++){d+=`Q ${18+i*16} ${i%2?80:20} ${28+i*16} 50 `}
   art=`<g filter="url(#${id}sk)"><path d="${d}" fill="none" stroke="url(#${id}g)" stroke-width="15" stroke-linecap="round"/></g>
     <path d="${d}" fill="none" stroke="${c1}" stroke-width="15.6" stroke-linecap="round" opacity=".22"/>
     <path d="${d}" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".30" transform="translate(-1,-3.5)"/>
     <path d="${d}" fill="none" stroke="#03101a" stroke-width="1.4" stroke-linecap="round" opacity=".35" stroke-dasharray="3 6"/>`;

 } else if(form===3){                              /* бацилла */
   defs+=grad(id+'g',32,26)+skin(id+'sk',.95,2.4,30,26);
   hairs=`<g class="mbFlag"><path d="M66 26 Q92 34 80 50 Q96 64 74 78" fill="none" stroke="${c3}" stroke-width="2.4" opacity=".85" stroke-linecap="round"/>
          <path d="M66 26 Q92 34 80 50 Q96 64 74 78" fill="none" stroke="#fff" stroke-width=".9" opacity=".25" stroke-linecap="round"/></g>`;
   art=`<g filter="url(#${id}sk)"><rect x="16" y="32" width="62" height="36" rx="18" fill="url(#${id}g)"/></g>
     <rect x="16" y="32" width="62" height="36" rx="18" fill="none" stroke="${c1}" stroke-width="1.2" opacity=".45"/>
     <ellipse cx="34" cy="42" rx="13" ry="5" fill="#fff" opacity=".33" transform="rotate(-8 34 42)"/>
     ${nucleus(58,52,7)}${granules(45,50,20,14)}`;

 } else if(form===5){                              /* диплококк — пара */
   defs+=grad(id+'g',34,26)+skin(id+'sk',.9,2.3,32,24);
   art=[[38,50,19],[63,50,17]].map(([x,y,r])=>`
     <g filter="url(#${id}sk)"><circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id}g)"/></g>
     <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${c1}" stroke-width="1.1" opacity=".45"/>
     <ellipse cx="${x-r*.35}" cy="${y-r*.38}" rx="${r*.3}" ry="${r*.2}" fill="#fff" opacity=".36" transform="rotate(-28 ${x} ${y})"/>
     ${granules(x,y,r*.62,8)}`).join('');

 } else if(form===6){                              /* стрептококк — цепочка */
   defs+=grad(id+'g',34,26)+skin(id+'sk',.95,2.2,32,24);
   let s='';for(let i=0;i<5;i++){const x=20+i*15,y=50+Math.sin(i*1.1)*11,r=11+R()*3;
     s+=`<g filter="url(#${id}sk)"><circle cx="${x}" cy="${y}" r="${r}" fill="url(#${id}g)"/></g>
        <circle cx="${x}" cy="${y}" r="${r}" fill="none" stroke="${c1}" stroke-width="1" opacity=".4"/>
        <ellipse cx="${x-r*.3}" cy="${y-r*.35}" rx="${r*.28}" ry="${r*.18}" fill="#fff" opacity=".34"/>${granules(x,y,r*.5,4)}`}
   art=s;

 } else if(form===7){                              /* амёба — с ложноножками */
   defs+=grad(id+'g',36,30)+skin(id+'sk',1.1,2.6,34,28);
   let d='M50 20 ';const N=9;
   for(let i=1;i<=N;i++){const a=i/N*6.283-1.57,rr=22+R()*13;
     d+=`Q ${50+Math.cos(a-.3)*(rr+9)} ${50+Math.sin(a-.3)*(rr+9)} ${50+Math.cos(a)*rr} ${50+Math.sin(a)*rr} `}
   d+='Z';
   art=`<g filter="url(#${id}sk)"><path d="${d}" fill="url(#${id}g)"/></g>
     <path d="${d}" fill="none" stroke="${c1}" stroke-width="1.2" opacity=".45"/>
     <ellipse cx="41" cy="40" rx="10" ry="6" fill="#fff" opacity=".3" transform="rotate(-25 41 40)"/>
     ${nucleus(55,54,9)}${granules(50,50,20,16)}`;

 } else if(form===8){                              /* диатомея — панцирь */
   defs+=grad(id+'g',34,26)+skin(id+'sk',1.4,2.0,32,24);
   let ribs='';for(let i=1;i<9;i++){const y=26+i*6;ribs+=`<line x1="${30+Math.abs(4-i)*1.6}" y1="${y}" x2="${70-Math.abs(4-i)*1.6}" y2="${y}" stroke="#03101a" stroke-width="1.1" opacity=".28"/>`}
   art=`<g filter="url(#${id}sk)"><ellipse cx="50" cy="50" rx="21" ry="30" fill="url(#${id}g)"/></g>
     <ellipse cx="50" cy="50" rx="21" ry="30" fill="none" stroke="${c1}" stroke-width="1.3" opacity=".5"/>
     ${ribs}<ellipse cx="43" cy="36" rx="6" ry="9" fill="#fff" opacity=".26" transform="rotate(-12 43 36)"/>
     ${granules(50,50,15,10)}`;

 } else {                                          /* инфузория */
   defs+=grad(id+'g',34,28)+skin(id+'sk',1.15,2.5,32,26);
   let ci='';for(let i=0;i<34;i++){const a=i/34*6.283,r1=27+Math.sin(a*3)*1.5,L=r1+7+R()*5;
     ci+=`<path d="M${50+Math.cos(a)*r1} ${50+Math.sin(a)*r1*.9} Q ${50+Math.cos(a+.12)*(L*.8)} ${50+Math.sin(a+.12)*(L*.75)} ${50+Math.cos(a+.22)*L} ${50+Math.sin(a+.22)*(L*.9)}"
       fill="none" stroke="${c1}" stroke-width="1.5" opacity="${(.45+R()*.4).toFixed(2)}" stroke-linecap="round"/>`}
   hairs=`<g class="mbCilia">${ci}</g>`;
   art=`<g filter="url(#${id}sk)"><ellipse cx="50" cy="50" rx="28" ry="25" fill="url(#${id}g)"/></g>
     <ellipse cx="50" cy="50" rx="28" ry="25" fill="none" stroke="${c1}" stroke-width="1.2" opacity=".45"/>
     <ellipse cx="40" cy="39" rx="10" ry="6" fill="#fff" opacity=".32" transform="rotate(-25 40 39)"/>
     ${nucleus(57,55,9)}<circle cx="40" cy="58" r="5" fill="#03101a" opacity=".22"/>
     <circle cx="38.6" cy="56.6" r="2" fill="#fff" opacity=".18"/>${granules(50,50,22,18)}`;
 }

 return `<svg class="mb" width="${S}" height="${S}" viewBox="0 0 100 100" style="--dur:${dur}s;--dir:${dir};--bob:${bob}s">
  <defs>${defs}
   <radialGradient id="${id}plate" cx="50%" cy="46%" r="52%">
     <stop offset="0%" stop-color="${c2}" stop-opacity=".22"/>
     <stop offset="62%" stop-color="${c3}" stop-opacity=".07"/>
     <stop offset="100%" stop-color="#000" stop-opacity="0"/>
   </radialGradient>
   <filter id="${id}dr" x="-40%" y="-40%" width="180%" height="180%">
     <feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#00121e" flood-opacity=".55"/>
   </filter>
  </defs>
  <circle cx="50" cy="47" r="46" fill="url(#${id}plate)"/>
  <ellipse class="mbShadow" cx="50" cy="90" rx="22" ry="4" fill="#000814" opacity=".3"/>
  <g class="mbFloat" filter="url(#${id}dr)"><g class="mbSpin">${hairs}${art}</g></g>

/* ================= сетевой слой ================= */
/* Клиент живёт внутри CasEdge и говорит с ОДНОЙ serverless-ручкой:
   POST /api/seawolf-session {action, token, ...}. От автономного сервера цеха
   отличий три, и все три вынуждены природой Vercel, а не вкусом:

   1. Партия не лежит в памяти сервера — функция не переживает вызова. Состояние
      едет с клиентом подписанным непрозрачным токеном; в нём только собственные
      ходы игрока, ключа к ответам там нет и подделать его нельзя.
   2. Таймер не опрашивается раз в секунду. Опрос давал 60 запросов в минуту при
      общем лимите 60 в минуту на пользователя: игра съедала лимит целиком и
      выбивала сама себя. Часы идут локально от дедлайна, сервер остаётся
      единственным судьёй и сверяется на каждом ходе.
   3. Профиль (уровень, виденные наборы, история) лежит в localStorage: таблицы
      под него в проекте нет, а ключа к ответам в нём тоже нет — худшее, что даёт
      правка профиля, это выбор своей трудности, и он и так кнопкой на меню. */
const EP='/api/seawolf-session';
let ERR=null, TOKEN=null, DEADLINE=null, recorded=false;

/* ---- профиль игрока ---- */
const PKEY='casedge_seawolf_profile';
const LEVELS=['Лёгкий','Средний','Сложный'], ASSESS='Ассессмент';
function loadProf(){
 try{const p=JSON.parse(localStorage.getItem(PKEY)||'{}');
  return {seen:Array.isArray(p.seen)?p.seen:[], level:LEVELS.includes(p.level)?p.level:'Средний',
   history:Array.isArray(p.history)?p.history:[], assessHistory:Array.isArray(p.assessHistory)?p.assessHistory:[],
   adaptMsg:typeof p.adaptMsg==='string'?p.adaptMsg:''}}
 catch(e){return {seen:[],level:'Средний',history:[],assessHistory:[],adaptMsg:''}}}
function saveProf(){
 try{localStorage.setItem(PKEY,JSON.stringify({seen:P.seen.slice(-800),level:P.level,
  history:P.history.slice(-500),assessHistory:P.assessHistory.slice(-500),adaptMsg:P.adaptMsg}))}catch(e){}}
let P=loadProf(), BANK=null, MODE='training', EXH=null;

/* Лестница адаптации — та же, что на сервере цеха, слово в слово. «Ассессмент»
   в неё не входит: в него заходят по своей воле и выходят на тот же уровень. */
function adapt(total){
 const i=LEVELS.indexOf(P.level); let ni=i, why;
 if(total>=90&&i<2){ni=i+1; why='Прошёл чисто — следующая партия будет плотнее.'}
 else if(total>=90&&i===2) why='Выше тренировочного уровня подниматься некуда. Если хочешь плотность реального отбора — открой ассессмент, он рядом с кнопкой партии.';
 else if(total<=60&&i>0){ni=i-1; why='Дам просторнее: смысл не в том, чтобы мучиться, а в том, чтобы поймать порядок ходов.'}
 else why='Уровень оставляю прежним — он тебе по руке.';
 P.level=LEVELS[ni]; P.adaptMsg=why; saveProf()}

/* профиль для экрана собирается из банка (сервер) и истории (локально) */
function buildProf(){
 if(!BANK) return null;
 const rem={}; LEVELS.forEach(l=>rem[l]=BANK.remaining[l]);
 return {level:P.level, levelNote:BANK.notes[P.level], adaptMsg:P.adaptMsg, exhausted:EXH,
  played:P.history.length,
  avg:P.history.length?Math.round(P.history.reduce((a,b)=>a+b,0)/P.history.length):null,
  remaining:rem, total:BANK.total,
  assessment:{level:ASSESS, note:BANK.notes[ASSESS], total:BANK.totals[ASSESS],
   remaining:BANK.remaining[ASSESS], played:P.assessHistory.length,
   best:P.assessHistory.length?Math.max.apply(null,P.assessHistory):null}}}

/* ---- запрос ---- */
/* Токен доступа берём у родительской страницы: iframe того же происхождения,
   сессия Supabase одна на приложение. Второй копии авторизации здесь нет. */
async function authToken(){
 try{ if(window.parent&&window.parent!==window&&typeof window.parent.swAuthToken==='function')
        return await window.parent.swAuthToken(); }catch(e){}
 return null}
async function api(action,payload){
 const t=await authToken();
 const h={'content-type':'application/json'}; if(t)h['Authorization']='Bearer '+t;
 const r=await fetch(EP,{method:'POST',headers:h,
   body:JSON.stringify(Object.assign({action:action,token:TOKEN,seenIds:P.seen},payload||{}))});
 let j=null; try{ j=await r.json() }catch(e){ throw new Error('сервер ответил не JSON ('+r.status+')') }
 if(r.status===401) throw new Error('Сессия не найдена. Войди в аккаунт CasEdge и открой игру заново.');
 if(r.status===429) throw new Error('Слишком много запросов подряд. Подожди минуту и продолжи — партия не потеряна.');
 if(j&&j.error) throw new Error((j.error&&j.error.message)||String(j.error));
 if(!r.ok) throw new Error('сервер ответил '+r.status);
 if(j&&j.token) TOKEN=j.token;
 if(j&&j.view&&typeof j.view.msLeft==='number') DEADLINE=Date.now()+j.view.msLeft;
 return j}

let SID=null, V=null, REV=null, PROF=null, sel=[], pick=null, modal=null, tutStep=0, tick=null, busy=false;
const mm=ms=>String(Math.floor(ms/60000)).padStart(2,'0')+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0');
const hhmm=ms=>{const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);return m+' мин '+String(s).padStart(2,'0')+' с'};

/** одна обёртка на все действия: busy снимается всегда, ошибка попадает на экран */
async function act(fn){
 if(busy) return; busy=true; ERR=null;
 try{ await fn() }
 catch(e){ ERR=e.message||String(e); clearInterval(tick); }
 finally{ busy=false; render(); }}

async function boot(){ await act(async()=>{ BANK=await api('state'); PROF=buildProf() }) }

function startGame(mode){ return act(async()=>{
 MODE=(mode==='assessment')?'assessment':'training';
 TOKEN=null; DEADLINE=null; recorded=false;
 const lvl=(MODE==='assessment')?ASSESS:P.level;
 const r=await api('pick',{level:lvl});
 SID=r.gameId; V=r.view; REV=null; sel=[]; pick=null; modal=null;
 EXH=r.wrapped||null;
 if(!P.seen.includes(r.gameId)){ P.seen.push(r.gameId); saveProf() }
 else if(EXH){ P.seen=P.seen.filter(id=>!sameLevelIds(lvl).includes(id)); P.seen.push(r.gameId); saveProf() }
 PROF=buildProf();
 clearInterval(tick); tick=setInterval(clock,1000);
})}
/* второй круг: список виденных на этом уровне сбрасывается, иначе счётчик
   «осталось» навсегда стоит нулём и врёт про банк */
function sameLevelIds(lvl){ return (BANK&&BANK.levelIds&&BANK.levelIds[lvl])||[] }

/** локальные часы: сервер по-прежнему единственный судья, но спрашивают его ходами */
function clock(){
 if(!V||V.phase==='done'||DEADLINE===null) return;
 V.msLeft=Math.max(0,DEADLINE-Date.now());
 if(V.msLeft===0){ clearInterval(tick);
   act(async()=>{ const r=await api('view'); V=r.view; if(V.phase==='done') await finish(); });
   return }
 paintTimer()}

function take(o){ if(o==null) return; return act(async()=>{ const r=await api('choose',{option:o}); V=r.view; pick=null;
 if(V.phase==='done'){ clearInterval(tick); await finish() } })}
function submitTrio(){ if(sel.length!==3) return; return act(async()=>{
 const r=await api('submit',{trio:sel}); V=r.view; sel=[]; pick=null;
 if(V.phase==='done'){ clearInterval(tick); await finish() } })}

/** конец партии: разбор с сервера, запись в профиль — ровно один раз */
async function finish(){
 const r=await api('reveal'); REV=r.reveal;
 if(r.totals){ V.total=r.totals.total; V.scores=r.totals.scores; V.siteMs=r.totals.siteMs; V.usedMs=r.totals.usedMs }
 if(!recorded){
  recorded=true;
  if(MODE==='assessment'){ P.assessHistory.push(V.total);
   V.adaptMsg=`Ассессмент не двигает тренировочный уровень — он остаётся «${P.level}». Здесь важен не процент, а то, на каком ходу решение было потеряно.`;
   saveProf() }
  else { P.history.push(V.total); adapt(V.total); V.adaptMsg=P.adaptMsg }
  V.nextLevel=P.level;
  PROF=buildProf() }
}
function newGame(){ clearInterval(tick); SID=null; V=null; REV=null; TOKEN=null; DEADLINE=null; recorded=false; sel=[]; pick=null; PROF=buildProf(); render() }
function quitToApp(){ clearInterval(tick);
 try{ if(window.parent&&window.parent!==window&&typeof window.parent.swExit==='function') return window.parent.swExit() }catch(e){}
 newGame()}

function paintTimer(){const l=document.getElementById('tlab'),f=document.getElementById('tfill');if(!f)return;
 const ms=V.msLeft; f.style.width=(ms/(30*60000)*100)+'%'; f.className='tfill'+(ms<5*60000?' hot':ms<10*60000?' warn':'');
 if(l)l.textContent=Math.ceil(ms/60000)+' мин'}
function tog(i){ if(sel.includes(i))sel=sel.filter(x=>x!==i); else if(sel.length<3)sel.push(i); render(); }

function preview(){ if(sel.length!==3) return null;
 const t=sel.map(i=>V.pool[i]); let met=0;
 const detail=ATTRS.map(k=>{const[lo,hi]=V.site.ranges[k],x=ATTRS.indexOf(k),s=t.reduce((a,m)=>a+m.a[x],0),ok=s>=lo*3&&s<=hi*3;if(ok)met++;
   return{attr:k,avg:+(s/3).toFixed(2),ok}});
 const tr=t.map(m=>m.trait),hd=tr.includes(V.site.desired),hu=tr.includes(V.site.undesired);
 if(hd)met++; if(!hu)met++;
 return{detail,hd,hu,percent:met*20}}

   <div class="dim small" style="margin:10px 0 4px">Цена хода — сколько стопроцентных трио из 120 осталось бы достижимо после каждого варианта:</div>
   <table><tr><th>раунд</th><th>вариант 1</th><th>вариант 2</th><th>вариант 3</th></tr>
   ${r.cost.map(c=>`<tr><td>${c.round}${c.played?'':' <span class="dim">не сыгран</span>'}</td>${c.options.map(o=>`<td class="${o.taken?'taken':''}">${o.name}: ${o.remaining}${o.taken?' ←ты':''}</td>`).join('')}</tr>`).join('')}</table>
   ${r.yourTrio?`<h3 style="margin:14px 0 4px;font-size:15px">Твоё трио: ${r.yourTrio.join(', ')}</h3>
   <table>${r.yourScore.detail.map(d=>`<tr><td>${d.attr}</td><td>среднее ${d.avg}</td><td>диапазон ${d.range[0]}–${d.range[1]}</td><td class="${d.ok?'ok':'bad'}">${d.ok?'ок':'МИМО'}</td></tr>`).join('')}</table>
   <table><tr><td>${V&&V.site?'':''}признаки</td><td>желательный: <b class="${r.yourScore.hasDesired?'ok':'bad'}">${r.yourScore.hasDesired?'есть':'НЕТ'}</b></td>
    <td>запрещённый: <b class="${r.yourScore.hasUndesired?'bad':'ok'}">${r.yourScore.hasUndesired?'ЕСТЬ':'нет'}</b></td>
    <td class="${r.yourScore.hasDesired&&!r.yourScore.hasUndesired?'ok':'bad'}">${r.yourScore.hasDesired&&!r.yourScore.hasUndesired?'ок':'МИМО'}</td></tr></table>`:''}
   <h3 style="margin:14px 0 4px;font-size:15px">Что было возможно из собранного</h3>
   ${r.possible?`<p class="small">${r.possible} трио на 100%. Пример: <b>${r.possibleExample.join(', ')}</b>.<br>
     <span class="dim">${r.spread.map(s=>`${s.attr}: решения лежат ${s.from}–${s.to}`).join(' · ')}</span></p>`
    :`<p class="bad small">Ни одного трио на 100% — потолок этого пула ниже.</p>`}</div>`});
 return h}

function render(){const app=document.getElementById('app');
 document.body.className = (V&&V.phase!=='done') ? ('d'+(V.siteIndex+1)) : '';
 if(ERR){app.innerHTML=scr_err();return}
 if(modal==='assess'){app.innerHTML=scr_menu()+scr_assess();return}
 if(modal==='tut'){app.innerHTML=scr_menu()+scr_tut();return}
 if(REV){app.innerHTML=scr_reveal();return}
 if(!SID||!V){app.innerHTML=scr_menu();return}
 app.innerHTML=scr_game()+(modal==='legend'?scr_legend():'')}

document.addEventListener('pointerdown',e=>{
 const c=e.target.closest('.ocard,.pill.click'); if(!c)return;
 const r=document.createElement('span'); r.className='ripple';
 const b=c.getBoundingClientRect(); const d=Math.max(b.width,b.height)*1.6;
 r.style.width=r.style.height=d+'px'; r.style.left=(e.clientX-b.left)+'px'; r.style.top=(e.clientY-b.top)+'px';
 if(getComputedStyle(c).position==='static')c.style.position='relative';
 c.appendChild(r); setTimeout(()=>r.remove(),560);
},{passive:true});
(function(){const n=document.getElementById('snow');if(!n)return;let s='';
 for(let i=0;i<46;i++){const sz=(1+Math.random()*3.4).toFixed(1),d=(26+Math.random()*46).toFixed(0),dl=(-Math.random()*60).toFixed(0);
  s+=`<span style="left:${(Math.random()*100).toFixed(1)}%;width:${sz}px;height:${sz}px;animation-duration:${d}s;animation-delay:${dl}s;opacity:${(.25+Math.random()*.6).toFixed(2)}"></span>`}
 n.innerHTML=s})();
boot();
