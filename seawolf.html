<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sea Wolf - CasEdge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
 --ink:#f2f6fa; --dim:#a9bccd; --dim2:#7f97ab;
 --card:#ffffff; --cardInk:#141413;
 --panel:rgba(8,20,18,.78); --hair:rgba(255,255,255,.10);
 /* 03.09.2026 · тёплые нейтрали сайта. Взяты из :root боевого index.html,
    ими крашены светлые экраны (меню, разбор) и внутренности белых карточек.
    Подводная сцена ОСТАЁТСЯ - артборды Board и Trio тоже тёмные, с тем же
    зелёно-бирюзовым градиентом; светлыми в макете сделаны только вход и разбор. */
 --canvas:#faf9f5; --cream:#e8e0d2; --soft:#f5f0e8; --paper:#ffffff;
 --ink-w:#141413; --body-w:#3d3d3a; --muted-w:#6c6a64; --faint-w:#8e8b82;
 --hair-w:#e6dfd8; --hair-w2:#ebe6df; --on-deep:#b7c9c4;
 --deep-1:#16302e; --deep-2:#122624; --deep-3:#0d1a18;
/* ── ТОКЕНЫ САЙТА · круг 1 дизайна, 03.09.2026 ──────────────────────────
   Значения скопированы из :root боевого index.html, а не подобраны на глаз.
   Меняются ТОЛЬКО акцент и типографика; тема (тёмная) и сцена не тронуты -
   светлая тема решается владельцем отдельно, см. ЗАМЕР_цены_дизайна. */
 --site-coral:#5db8a6; --site-coral-active:#3f8f7e; --site-amber:#e8a55a;
 --site-error:#c64545; --site-success:#5db872;
 --font-display:'Newsreader',Georgia,'Times New Roman',serif;
 --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
 --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
 --ok:var(--site-success); --bad:var(--site-error); --gold:var(--site-amber);
 --acc:var(--site-coral);
 --r:12px; --rl:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--body-w);
 font:400 15px/1.55 var(--font-sans);
 -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
h1,h2,h3,h4{letter-spacing:-.015em;font-weight:500;margin:0;font-family:var(--font-display)}
/* в партии - тёмная подводная сцена; вне партии (меню, разбор, отказ) - светлая
   страница. Переключатель уже был в клиенте: render() ставит body.d1/d2/d3 на
   время игры и снимает класс в конце. Ни строки JS для этого не добавлено. */
body:not(.d1):not(.d2):not(.d3){background:var(--cream);color:var(--body-w)}
body:not(.d1):not(.d2):not(.d3) #sea,
body:not(.d1):not(.d2):not(.d3) #caust,
body:not(.d1):not(.d2):not(.d3) #rays,
body:not(.d1):not(.d2):not(.d3) #snow,
body:not(.d1):not(.d2):not(.d3) #vig,
body:not(.d1):not(.d2):not(.d3) #grain{display:none}
body.d1,body.d2,body.d3{background:var(--deep-3);color:var(--ink)}
.mono{font-variant-numeric:tabular-nums lining-nums;font-family:var(--font-mono)}

/* ---------- фон: глубина, лучи, зерно ---------- */
#sea{position:fixed;inset:0;z-index:0;transition:background 1.6s ease;
 background:
  radial-gradient(120% 62% at 50% -14%, rgba(210,240,230,.22) 0%, rgba(93,184,166,.14) 26%, transparent 58%),
  linear-gradient(180deg,#1c3a37 0%,#16302e 22%,#122624 55%,#0f1f1d 78%,#0d1a18 100%)}
body.d1 #sea{background:
  radial-gradient(120% 62% at 50% -14%, rgba(210,240,230,.30) 0%, rgba(93,184,166,.18) 26%, transparent 58%),
  linear-gradient(180deg,#23473f 0%,#1b3a35 14%,#16302e 32%,#122624 54%,#0f1f1d 76%,#0d1a18 100%)}
body.d2 #sea{background:
  radial-gradient(120% 62% at 50% -14%, rgba(210,240,230,.18) 0%, rgba(93,184,166,.11) 26%, transparent 56%),
  linear-gradient(180deg,#16302e 0%,#132a27 14%,#102220 32%,#0e1c1a 54%,#0c1715 76%,#0a1210 100%)}
body.d3 #sea{background:
  radial-gradient(110% 55% at 50% -18%, rgba(210,240,230,.12) 0%, rgba(93,184,166,.07) 24%, transparent 54%),
  linear-gradient(180deg,#112423 0%,#0e1e1c 14%,#0b1817 32%,#091412 54%,#070f0e 76%,#050a09 100%)}
body.d1 #snow{opacity:.62} body.d2 #snow{opacity:.5} body.d3 #snow{opacity:.34}
body.d1 #rays{opacity:.19} body.d2 #rays{opacity:.12} body.d3 #rays{opacity:.06}
body.d1 #caust{opacity:.17} body.d2 #caust{opacity:.11} body.d3 #caust{opacity:.05}
body.d3 #vig{background:radial-gradient(120% 82% at 50% 34%,transparent 26%,rgba(0,6,12,.6) 66%,rgba(0,4,8,.86) 100%)}
/* каустика: настоящий шум, а не полоски */
#caust{position:fixed;inset:-12%;z-index:1;pointer-events:none;opacity:.13;mix-blend-mode:screen;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='560' height='560'><filter id='c'><feTurbulence type='fractalNoise' baseFrequency='0.011 0.02' numOctaves='3' seed='7'/><feColorMatrix type='matrix' values='0 0 0 0 0.66  0 0 0 0 0.92  0 0 0 0 0.86  0 0 0 -2.2 1.05'/></filter><rect width='560' height='560' filter='url(%23c)'/></svg>");
 background-size:820px 820px;filter:blur(1.5px);animation:caust 42s linear infinite}
@keyframes caust{0%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-3%,2%,0) scale(1.06)}100%{transform:translate3d(0,0,0) scale(1)}}
/* лучи света от поверхности */
#rays{position:fixed;inset:-25% -15%;z-index:1;pointer-events:none;opacity:.13;mix-blend-mode:screen;
 background:
  linear-gradient(99deg,transparent 44%,rgba(210,240,230,.75) 47.5%,transparent 51%),
  linear-gradient(93deg,transparent 60%,rgba(210,240,230,.5) 63.5%,transparent 67%),
  linear-gradient(108deg,transparent 20%,rgba(210,240,230,.42) 23.5%,transparent 27%),
  linear-gradient(87deg,transparent 76%,rgba(210,240,230,.32) 79%,transparent 82%);
 filter:blur(30px);animation:ray 46s ease-in-out infinite alternate}
@keyframes ray{from{transform:translate3d(-2%,0,0) rotate(-.4deg)}to{transform:translate3d(3%,1.5%,0) rotate(.5deg)}}
/* морской снег */
#snow{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.5}
#snow span{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(219,238,231,.9),rgba(219,238,231,0) 70%);
 animation:snowfall linear infinite}
@keyframes snowfall{0%{transform:translate3d(0,-8vh,0)}100%{transform:translate3d(2vw,108vh,0)}}
#vig{position:fixed;inset:0;z-index:2;pointer-events:none;
 background:radial-gradient(125% 88% at 50% 34%,transparent 34%,rgba(0,9,17,.42) 74%,rgba(0,6,12,.72) 100%)}
#grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.wrap{position:relative;z-index:3;max-width:1240px;margin:0 auto;padding:18px 22px 48px}

/* ---------- верхняя телеметрия ---------- */
.top{display:flex;align-items:flex-start;gap:20px;margin-bottom:20px}
.tl{flex:1;display:flex;flex-direction:column;gap:9px}
.trow{display:flex;align-items:center;gap:14px}
.lab{width:150px;text-align:right;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
.val{font-size:13px;color:var(--ink)}
.tbar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.13);overflow:hidden}
.tfill{height:100%;background:var(--acc);transition:width .9s linear}
.tfill.warn{background:var(--gold)}.tfill.hot{background:var(--bad)}
.segs{flex:1;display:flex;gap:2px}
.seg{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
.seg.on{background:var(--gold)}.seg.done{background:var(--acc)}
.exit{background:transparent;border:1px solid var(--hair);color:var(--dim);border-radius:20px;padding:7px 16px;font-size:12.5px;cursor:pointer;transition:.15s}
.exit:hover{border-color:rgba(255,255,255,.3);color:var(--ink)}

/* ---------- сцена ---------- */
.stage{display:grid;grid-template-columns:1fr 276px;gap:26px;align-items:start}
@media(max-width:960px){.stage{grid-template-columns:1fr}}
.sechead{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);margin:0 0 12px}

/* ---------- карточки предложений ---------- */
.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:30px}
@media(max-width:800px){.offers{grid-template-columns:1fr}}
.ocard{background:var(--card);border-radius:var(--rl);padding:18px 18px 16px;color:var(--cardInk);
 position:relative;cursor:pointer;
 box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 2px 6px rgba(0,20,35,.18), 0 14px 34px rgba(0,15,28,.34);
 transition:transform .2s cubic-bezier(.2,.7,.3,1), box-shadow .2s}
.ocard:hover{transform:translateY(-4px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 4px 10px rgba(0,20,35,.2),0 22px 46px rgba(0,15,28,.44)}
.ocard:active{transform:translateY(-1px) scale(.995)}
.ocard.picked{box-shadow:0 0 0 2px var(--gold),0 20px 44px rgba(0,15,28,.44)}
.ocard .nm{text-align:center;font-weight:600;font-size:16.5px;letter-spacing:-.01em;color:var(--ink-w)}
.ocard .sub{text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint-w);margin-top:2px}
.ocard .art{display:flex;justify-content:center;margin:10px 0 12px}
.hr{height:1px;background:var(--hair-w);margin:2px 0 8px}
.arow{display:flex;align-items:center;gap:11px;padding:5px 0;font-size:14px}
.arow .ico{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;background:var(--soft);border-radius:7px}
.arow .an{flex:1;color:var(--muted-w);font-size:13.5px}
.arow .av{font-weight:650;color:var(--ink-w);font-size:15px}
.trow2{display:flex;align-items:center;gap:11px;padding:9px 0 0;margin-top:6px;border-top:1px solid var(--hair-w);font-size:13.5px;color:var(--body-w)}
.plus{position:absolute;right:14px;bottom:13px;width:32px;height:32px;border-radius:50%;
 background:var(--ink-w);color:#fff;border:0;cursor:pointer;display:grid;place-items:center;transition:.15s}
.plus:hover{background:var(--acc);transform:scale(1.08)}

/* ---------- пул ---------- */
.pool{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:800px){.pool{grid-template-columns:repeat(2,1fr)}}
.pill{background:var(--card);border-radius:var(--r);padding:22px 10px 11px;color:var(--cardInk);position:relative;
 box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 20px rgba(0,15,28,.28);
 transition:transform .18s cubic-bezier(.2,.7,.3,1),box-shadow .18s}
.pill.click{cursor:pointer}
.pill.click:hover{transform:translateY(-3px);box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 14px 30px rgba(0,15,28,.4)}
.pill.sel{box-shadow:0 0 0 2px var(--gold),0 14px 30px rgba(0,15,28,.4)}
.pill .thumb{position:absolute;top:-20px;left:50%;transform:translateX(-50%)}
.pill .nm{text-align:center;font-weight:600;font-size:13px;letter-spacing:-.005em;margin:6px 0 7px;color:var(--ink-w)}
.pill .st{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12.5px}
.pill .st i{display:grid;place-items:center;width:16px;height:16px;opacity:.55}
.pill .st b{color:var(--ink-w);font-weight:650}
.pill .tr{position:absolute;top:8px;right:9px;opacity:.9}

/* ---------- панель ---------- */
.panel{background:var(--panel);border:1px solid var(--hair);border-radius:var(--rl);
 backdrop-filter:blur(14px) saturate(120%);overflow:hidden}
.panel h3{padding:14px 17px 12px;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);
 border-bottom:1px solid var(--hair);font-weight:500}
.panel .body{padding:13px 17px 16px}
.grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);margin:10px 0 4px}
.grp:first-child{margin-top:0}
.prow{display:flex;align-items:center;gap:12px;padding:7px 0}
.prow+.prow{border-top:1px solid rgba(255,255,255,.055)}
.prow .ico{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;background:rgba(255,255,255,.06);border-radius:8px}
.prow .n{flex:1;font-size:13.5px;color:var(--on-deep)}
.prow .v{font-weight:650;font-size:15px}
.tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2)}

/* ---------- нижняя плашка ---------- */
/* Полоса действия прижата к низу окна. До этого она стояла в потоке: как только
   выбран третий микроб, панель предпросмотра раскрывалась и кнопка «Сдать лечение»
   уезжала за нижний край - на 1456x821 её низ оказывался на 1054, и найти её можно
   было только клавишей End. Кандидат в таймере читает это как зависшую игру.
   Найдено живым прогоном, не чтением. */
.bottom{margin-top:30px;display:flex;align-items:center;gap:16px;
 position:sticky;bottom:14px;z-index:5;
 background:rgba(6,14,21,.96);border:1px solid var(--hair);border-radius:var(--rl);padding:14px 18px;backdrop-filter:blur(12px)}
.bottom .i{width:24px;height:24px;flex:0 0 24px;border-radius:50%;border:1.4px solid var(--gold);color:var(--gold);
 display:grid;place-items:center;font-size:12px;font-weight:700;font-style:italic}
.bottom .txt{flex:1;font-size:13.5px;color:var(--on-deep)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:11px 22px;font-size:14.5px;font-weight:500;cursor:pointer;transition:.15s}
.btn:hover{background:var(--site-coral-active)}.btn[disabled]{background:rgba(255,255,255,.08);color:var(--faint-w);cursor:default}
.btn.g{background:var(--acc)}.btn.g:hover{background:var(--site-coral-active)}
.btn.ghost{background:transparent;border:1px solid var(--hair);color:var(--dim)}
.btn.ghost:hover{border-color:rgba(255,255,255,.3);color:var(--ink)}
.legend{position:fixed;right:22px;bottom:22px;z-index:20;background:rgba(255,255,255,.94);color:var(--ink-w);border:0;
 border-radius:9px;padding:9px 17px;font-size:13.5px;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.4)}

/* ---------- живые бактерии ---------- */
.mb{overflow:visible;will-change:transform}
.mbSpin{transform-box:fill-box;transform-origin:50% 50%;animation:spin var(--dur,18s) linear infinite;animation-direction:var(--dir,normal)}
.mbFloat{transform-box:fill-box;transform-origin:50% 50%;animation:float var(--bob,4s) ease-in-out infinite}
.mbSpikes{transform-box:fill-box;transform-origin:50% 50%;animation:spin calc(var(--dur,18s)*1.7) linear infinite reverse}
.mbCilia{transform-box:fill-box;transform-origin:50% 50%;animation:cilia 2.1s ease-in-out infinite}
.mbFlag{transform-box:fill-box;transform-origin:22% 50%;animation:flag 1.5s ease-in-out infinite}
.mbShadow{animation:shad var(--bob,4s) ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shad{0%,100%{opacity:.3;transform:scaleX(1)}50%{opacity:.18;transform:scaleX(.88)}}
@keyframes cilia{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes flag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@media (prefers-reduced-motion:reduce){.mbSpin,.mbFloat,.mbSpikes,.mbCilia,.mbFlag,.mbShadow{animation:none}}
.ocard .mb,.pill .mb{transition:transform .28s cubic-bezier(.2,.7,.3,1)}
.ocard:hover .mbSpin,.pill.click:hover .mbSpin{animation-duration:calc(var(--dur,18s)/3.4)}
.ocard:hover .mb{transform:scale(1.09)}
.pill.click:hover .mb{transform:scale(1.14)}
.ocard.picked .mbSpin,.pill.sel .mbSpin{animation-duration:calc(var(--dur,18s)/5)}
.ripple{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(20,60,90,.16),transparent 70%);
 transform:translate(-50%,-50%) scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

/* ---------- модалки ---------- */
.veil{position:fixed;inset:0;z-index:30;background:rgba(2,10,17,.74);backdrop-filter:blur(6px);display:grid;place-items:center;padding:24px}
.modal{max-width:740px;width:100%;background:linear-gradient(180deg,rgba(16,38,54,.98),rgba(8,24,36,.98));
 border:1px solid var(--hair);border-radius:20px;padding:34px 38px 28px;box-shadow:0 40px 90px rgba(0,0,0,.6);max-height:88vh;overflow:auto}
.modal .kicker{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.modal h2{font-size:25px;margin:0 0 14px;letter-spacing:-.02em}
.modal p{color:var(--on-deep);margin:0 0 13px;font-size:15px}
.modal ul{color:var(--on-deep);margin:0 0 13px;padding-left:20px}
.modal li{margin:5px 0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}
@media(max-width:700px){.row3{grid-template-columns:1fr}}
.phase{text-align:center}
.phase .b{width:64px;height:64px;margin:0 auto 10px;border-radius:16px;background:rgba(255,255,255,.06);
 border:1px solid var(--hair);display:grid;place-items:center}
.phase .t{font-size:13px;color:var(--on-deep);font-weight:500}
.phase .d{font-size:11.5px;color:var(--dim2);margin-top:3px}
.mbtns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;align-items:center}
.dots{display:flex;gap:6px;margin-right:auto}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2)}.dot.on{background:var(--gold)}
.note{background:rgba(216,165,60,.10);border-left:2px solid var(--gold);padding:12px 15px;border-radius:0 10px 10px 0;
 color:var(--on-deep);font-size:13px;margin:16px 0}
.lg{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:640px){.lg{grid-template-columns:1fr}}
.lgrow{display:flex;align-items:center;gap:12px;padding:8px 0;font-size:14px;border-top:1px solid rgba(255,255,255,.055)}
.lgrow .ico{width:30px;height:30px;flex:0 0 30px;display:grid;place-items:center;background:rgba(255,255,255,.06);border-radius:8px}

/* ---------- титул ---------- */
.hero{max-width:860px;margin:6vh auto 0;text-align:center}
.brand{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--dim2);margin-bottom:20px}
.hero h1{font-size:52px;letter-spacing:-.035em;font-weight:600;margin:0 0 10px;
 background:linear-gradient(180deg,#ffffff,#a9cbe0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{color:var(--dim);max-width:560px;margin:0 auto 26px;font-size:16px}
.reef{display:flex;justify-content:center;align-items:flex-end;gap:26px;margin-bottom:6px;height:120px}
.stats{display:flex;gap:34px;justify-content:center;margin-top:26px;color:var(--dim2);font-size:12px;letter-spacing:.06em}
.stats b{display:block;font-size:19px;color:var(--ink);letter-spacing:-.01em;margin-bottom:2px}

/* ---------- разбор ---------- */
.rcard{background:var(--panel);border:1px solid var(--hair);border-radius:var(--rl);padding:22px 24px;margin-bottom:18px;backdrop-filter:blur(12px)}
.rcard h2{font-size:19px;margin:0 0 12px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
td,th{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);text-align:left}
th{color:var(--dim2);font-weight:500;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.ok{color:var(--ok)}.bad{color:var(--bad)}.taken{color:var(--gold);font-weight:600}
.big{font-size:56px;font-weight:600;letter-spacing:-.04em;line-height:1}
.dim{color:var(--dim)}.small{font-size:13px}

/* ══════════════════════════════════════════════════════════════════════════
   СВЕТЛЫЕ ЭКРАНЫ · вход и разбор, по артбордам Main и Debrief
   Артборд Main: кремовая страница, сверху тёмная лента 560px с той же
   подводной глубиной. Артборд Debrief: светлая страница #faf9f5, сверху
   тёмная лента с крупным Newsreader. Оба - вне таймера.
   Всё ниже действует ТОЛЬКО когда на body нет класса глубины, то есть
   в партию не вмешивается ни одним правилом.
   ══════════════════════════════════════════════════════════════════════════ */
body:not(.d1):not(.d2):not(.d3) .wrap{padding:0 22px 56px;max-width:1180px}

/* лента-герой: подводная глубина внутри неё, а не на всей странице */
body:not(.d1):not(.d2):not(.d3) .hero{
  max-width:none;margin:18px 0 30px;padding:44px 40px 40px;border-radius:22px;
  background:
    radial-gradient(120% 70% at 50% -10%, rgba(210,240,230,.20) 0%, rgba(93,184,166,.12) 28%, transparent 60%),
    linear-gradient(180deg,var(--deep-1) 0%,var(--deep-2) 55%,var(--deep-3) 100%);
  box-shadow:0 1px 2px rgba(20,20,19,.05), 0 18px 44px rgba(20,20,19,.14);overflow:hidden;position:relative}
body:not(.d1):not(.d2):not(.d3) .hero::after{
  content:'';position:absolute;left:18%;top:-18%;width:150px;height:140%;pointer-events:none;
  background:linear-gradient(180deg,rgba(210,240,230,.22) 0%,rgba(210,240,230,.06) 55%,rgba(210,240,230,0) 100%);
  transform:rotate(8deg);filter:blur(28px)}
body:not(.d1):not(.d2):not(.d3) .hero>*{position:relative;z-index:1}
body:not(.d1):not(.d2):not(.d3) .hero h1{
  font-size:64px;font-weight:500;letter-spacing:-.02em;background:none;color:#fff;-webkit-text-fill-color:#fff}
body:not(.d1):not(.d2):not(.d3) .hero .brand{color:var(--on-deep);letter-spacing:.09em}
body:not(.d1):not(.d2):not(.d3) .hero .lead{color:var(--on-deep);font-size:18px;max-width:620px}
body:not(.d1):not(.d2):not(.d3) .hero .stats{color:var(--on-deep)}
body:not(.d1):not(.d2):not(.d3) .hero .stats b{color:#fff;font-family:var(--font-display);font-size:26px;font-weight:500}
body:not(.d1):not(.d2):not(.d3) .hero .big{color:#fff;font-family:var(--font-display);font-size:104px;font-weight:500;letter-spacing:-.02em}
body:not(.d1):not(.d2):not(.d3) .hero .dim{color:var(--on-deep)}
body:not(.d1):not(.d2):not(.d3) .hero .btn.ghost,
body:not(.d1):not(.d2):not(.d3) .hero .exit{border-color:rgba(255,255,255,.24);color:#fff}

/* разбор: белые карточки на светлой странице вместо полупрозрачных тёмных */
body:not(.d1):not(.d2):not(.d3) .top{color:var(--muted-w)}
body:not(.d1):not(.d2):not(.d3) .top .lab{color:var(--faint-w)}
body:not(.d1):not(.d2):not(.d3) .top .val{color:var(--ink-w)}
body:not(.d1):not(.d2):not(.d3) .tbar,
body:not(.d1):not(.d2):not(.d3) .seg{background:var(--hair-w)}
body:not(.d1):not(.d2):not(.d3) .exit{border-color:var(--hair-w);color:var(--muted-w)}
body:not(.d1):not(.d2):not(.d3) .exit:hover{border-color:var(--acc);color:var(--ink-w)}
body:not(.d1):not(.d2):not(.d3) .rcard{
  background:var(--paper);border:1px solid var(--hair-w);border-radius:18px;padding:26px 28px;
  backdrop-filter:none;box-shadow:0 1px 2px rgba(20,20,19,.05), 0 12px 32px rgba(20,20,19,.07)}
body:not(.d1):not(.d2):not(.d3) .rcard h2{font-size:24px;color:var(--ink-w)}
body:not(.d1):not(.d2):not(.d3) .big{color:var(--ink-w);font-family:var(--font-display);font-weight:500;letter-spacing:-.02em}
body:not(.d1):not(.d2):not(.d3) .dim{color:var(--muted-w)}
body:not(.d1):not(.d2):not(.d3) td,
body:not(.d1):not(.d2):not(.d3) th{border-bottom:1px solid var(--hair-w2)}
body:not(.d1):not(.d2):not(.d3) th{color:var(--faint-w);font-size:12px;letter-spacing:.09em}
body:not(.d1):not(.d2):not(.d3) .note{
  background:var(--paper);border:1px solid var(--hair-w);border-left:4px solid var(--gold);
  border-radius:0 14px 14px 0;color:var(--body-w);font-size:15px;padding:14px 18px}
body:not(.d1):not(.d2):not(.d3) .btn[disabled]{background:var(--hair-w);color:var(--faint-w)}
body:not(.d1):not(.d2):not(.d3) .reef{height:132px;margin-bottom:10px}

/* ── адаптив: было шесть правил на игру с доской и трио ────────────────────── */
@media (max-width:720px){
  .wrap{padding:14px 14px 44px}
  body:not(.d1):not(.d2):not(.d3) .wrap{padding:0 14px 44px}
  body:not(.d1):not(.d2):not(.d3) .hero{padding:28px 20px 26px;border-radius:16px;margin:12px 0 22px}
  body:not(.d1):not(.d2):not(.d3) .hero h1{font-size:38px}
  body:not(.d1):not(.d2):not(.d3) .hero .big{font-size:64px}
  body:not(.d1):not(.d2):not(.d3) .rcard{padding:18px 16px;border-radius:14px}
  .top{flex-direction:column;gap:12px}
  .lab{width:auto;text-align:left;flex:none}
  .trow{flex-wrap:wrap}
  .stats{gap:18px;flex-wrap:wrap}
  .reef{gap:12px;height:96px}
  .modal{padding:22px 18px 18px;border-radius:16px}
  .modal h2{font-size:21px}
  .bottom{flex-direction:column;align-items:stretch;gap:10px;padding:12px 14px}
  .btn{width:100%}
  table{font-size:12.5px} td,th{padding:7px 6px}
}

   2. Таймер не опрашивается раз в секунду. Опрос давал 60 запросов в минуту при
      общем лимите 60 в минуту на пользователя: игра съедала лимит целиком и
      выбивала сама себя. Часы идут локально от дедлайна, сервер остаётся
      единственным судьёй и сверяется на каждом ходе.
   3. Профиль (уровень, виденные наборы, история) лежит в localStorage И на
      аккаунте (раздел `seawolf` в `profiles.client_state`, через родительскую
      страницу — одна коробка на всё клиентское состояние).
      Локальная копия — кэш: игра стартует без сети и работает как раньше.
      Ключа к ответам в профиле нет — худшее, что даёт его правка, это выбор
      своей трудности, и он и так кнопкой на меню. */
const EP='/api/seawolf-session';
let ERR=null, TOKEN=null, DEADLINE=null, recorded=false;

/* ---- профиль игрока ---- */
const PKEY='casedge_seawolf_profile';
const LEVELS=[LV_E,LV_M,LV_H], ASSESS=LV_A;
function loadProf(){
 try{const p=JSON.parse(localStorage.getItem(PKEY)||'{}');
  return {seen:Array.isArray(p.seen)?p.seen:[], level:LEVELS.includes(p.level)?p.level:LV_M,
   history:Array.isArray(p.history)?p.history:[], assessHistory:Array.isArray(p.assessHistory)?p.assessHistory:[],
   adaptMsg:typeof p.adaptMsg==='string'?p.adaptMsg:'', ts:Number(p.ts||0)}}
 catch(e){return {seen:[],level:LV_M,history:[],assessHistory:[],adaptMsg:'',ts:0}}}
function profBody(){return {seen:P.seen.slice(-800),level:P.level,
  history:P.history.slice(-500),assessHistory:P.assessHistory.slice(-500),adaptMsg:P.adaptMsg,ts:Date.now()}}
function saveProf(){
 const body=profBody();
 try{localStorage.setItem(PKEY,JSON.stringify(body))}catch(e){}
 /* И на аккаунт. Решение 08.08: чистка браузера больше не обнуляет банк из 150
    наборов. Отдельного входа «по коду» не заводим — игрок уже авторизован,
    иначе ручка игры вернула бы 401. Отказ здесь молчит: без сети игра работает
    как раньше, на localStorage. */
 try{ if(window.parent&&window.parent!==window&&typeof window.parent.swProfileSave==='function')
        window.parent.swProfileSave(body); }catch(e){}}

/* Подтягивание профиля с аккаунта. Локальный профиль уже загружен синхронно,
   поэтому игра стартует мгновенно и без сети; облако приезжает следом.
   Слияние: `seen` ОБЪЕДИНЯЕТСЯ — потерять пройденный набор хуже, чем показать
   чуть устаревший уровень; остальное берётся из более свежей записи по `ts`. */
/* 28.08.2026, долг цеха игр с круга 95. `seen` объединялся, а истории счётов
   брались из более свежей записи ЦЕЛИКОМ: игры, сыгранные на втором
   устройстве, исчезали. Обе истории - массивы чисел без меток, слить их можно
   только по совпадению: если одна лежит внутри другой, берём длинную; иначе
   берём общее начало и дописываем оба хвоста, свежий последним. Ни одного
   выдуманного числа и ни одного потерянного; порядок между хвостами роли не
   играет - история читается только счётом сыгранных, средним и лучшим. */
function mergeRuns(a,b,bIsNewer){
 const A=Array.isArray(a)?a:[], B=Array.isArray(b)?b:[];
 if(!A.length) return B.slice();
 if(!B.length) return A.slice();
 const ja='\u0001'+A.join('\u0001')+'\u0001', jb='\u0001'+B.join('\u0001')+'\u0001';
 if(ja.indexOf(jb)>=0) return A.slice();
 if(jb.indexOf(ja)>=0) return B.slice();
 let i=0; while(i<A.length&&i<B.length&&A[i]===B[i]) i++;
 const older=bIsNewer?A:B, newer=bIsNewer?B:A;
 return older.concat(newer.slice(i))}
async function hydrateProf(){
 let cloud=null;
 try{ if(window.parent&&window.parent!==window&&typeof window.parent.swProfileLoad==='function')
        cloud=await window.parent.swProfileLoad(); }catch(e){}
 if(!cloud||typeof cloud!=='object') return false;
 const seen=Array.from(new Set([].concat(Array.isArray(cloud.seen)?cloud.seen:[], P.seen)));
 const cloudNewer=Number(cloud.ts||0) > Number(P.ts||0);
 const src=cloudNewer?cloud:P;
 P={seen:seen,
    level:LEVELS.includes(src.level)||src.level===ASSESS?src.level:P.level,
    history:mergeRuns(P.history,cloud.history,cloudNewer),
    assessHistory:mergeRuns(P.assessHistory,cloud.assessHistory,cloudNewer),
    adaptMsg:typeof src.adaptMsg==='string'?src.adaptMsg:P.adaptMsg,
    ts:Math.max(Number(cloud.ts||0),Number(P.ts||0))};
 saveProf();
 return true}
let P=loadProf(), BANK=null, MODE='training', EXH=null;

/* Лестница адаптации — та же, что на сервере цеха, слово в слово. «Ассессмент»
   в неё не входит: в него заходят по своей воле и выходят на тот же уровень. */
function adapt(total){
 const i=LEVELS.indexOf(P.level); let ni=i, why;
 if(total>=90&&i<2){ni=i+1; why=t('sw_5')}
 else if(total>=90&&i===2) why=t('sw_6');
 else if(total<=60&&i>0){ni=i-1; why=t('sw_7')}
 else why=t('sw_8');
 P.level=LEVELS[ni]; P.adaptMsg=why; saveProf()}

/* профиль для экрана собирается из банка (сервер) и истории (локально) */
function buildProf(){
 if(!BANK) return null;
 const rem={}; LEVELS.forEach(l=>rem[l]=BANK.remaining[l]);
 return {level:P.level, levelNote:BANK.notes[P.level], adaptMsg:P.adaptMsg, exhausted:EXH,
  played:P.history.length,
  avg:P.history.length?Math.round(P.history.reduce((a,b)=>a+b,0)/P.history.length):null,
  remaining:rem, total:BANK.total,
  assessment:{level:ASSESS, note:BANK.notes[ASSESS], total:BANK.totals[ASSESS],
   remaining:BANK.remaining[ASSESS], played:P.assessHistory.length,
   best:P.assessHistory.length?Math.max.apply(null,P.assessHistory):null}}}

async function authToken(){
 try{ if(window.parent&&window.parent!==window&&typeof window.parent.swAuthToken==='function')
        return await window.parent.swAuthToken(); }catch(e){}
 return null}
async function api(action,payload){
 const t=await authToken();
 const h={'content-type':'application/json'}; if(t)h['Authorization']='Bearer '+t;
 const r=await fetch(EP,{method:'POST',headers:h,
   /* Круг 72, находка dev'а: язык не доезжал до ручки вовсе — см. sfl.NEW.html. */
   body:JSON.stringify(Object.assign({action:action,token:TOKEN,seenIds:P.seen,
                                      uiLang:(action==='reveal'?SITE_LANG:UILANG)  /* разбор — на языке клиента */},payload||{}))});
 let j=null; try{ j=await r.json() }catch(e){ throw new Error(t('sw_9')+r.status+')') }
 if(r.status===401) throw new Error(t('sw_10'));
 if(r.status===429) throw new Error(t('sw_11'));
 if(j&&j.error) throw new Error((j.error&&j.error.message)||String(j.error));
 if(!r.ok) throw new Error(t('sw_12')+r.status);
 if(j&&j.token) TOKEN=j.token;
 if(j&&j.view&&typeof j.view.msLeft==='number') DEADLINE=Date.now()+j.view.msLeft;
 return j}

 else if(EXH){ P.seen=P.seen.filter(id=>!sameLevelIds(lvl).includes(id)); P.seen.push(r.gameId); saveProf() }

     раз, под той же защёлкой `recorded`, что и запись в профиль: повторный
     рендер экрана итогов не должен множить счётчик. */
  try{ if(window.parent&&window.parent!==window&&typeof window.parent.swRecordGame==='function')
        window.parent.swRecordGame(MODE) }catch(e){}
  PROF=buildProf() }
}

  ${ATTRS.map((a,x)=>`<div class="arow"><span class="ico">${icon(ATTR_ICON[a],16,'#5b6d7e')}</span><span class="an">${a}</span><span class="av mono">${m.a[x]}</span></div>`).join('')}
  <div class="trow2">${icon(T.ic,17,T.c2)}<span>${esc(m.trait)}</span></div>
  <button class="plus" onclick="event.stopPropagation();take(${i}${t('sw_105')}<svg width="15" height="15" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg></button></div>`}
function pillCard(m,i,click,s){const T=TRAITS[m.trait];
 return `<div class="pill ${click?'click':''} ${s?'sel':''}" ${click?`onclick="tog(${i})"`:''}>
  <span class="tr">${icon(T.ic,15,T.c2)}</span><div class="thumb">${microbe(m.name,m.trait,50)}</div>
  <div class="nm">${esc(m.name)}</div>
  <div class="st">${ATTRS.map((a,x)=>`<i>${icon(ATTR_ICON[a],13,'#8ea0b0')}</i><b class="mono">${m.a[x]}</b>`).join('')}</div></div>`}

function preview(){ if(sel.length!==3) return null;
 const t=sel.map(i=>V.pool[i]); let met=0;
 const detail=ATTRS.map(k=>{const[lo,hi]=V.site.ranges[k],x=ATTRS.indexOf(k),s=t.reduce((a,m)=>a+m.a[x],0),ok=s>=lo*3&&s<=hi*3;if(ok)met++;
   return{attr:k,avg:+(s/3).toFixed(2),ok}});
 const tr=t.map(m=>m.trait),hd=tr.includes(V.site.desired),hu=tr.includes(V.site.undesired);
 if(hd)met++; if(!hu)met++;
 return{detail,hd,hu,percent:met*20}}

function scr_game(){const prospect=V.phase==='prospect', ms=V.msLeft, pv=preview();
 return `<div class="top"><div class="tl">
   <div class="trow"><span class="lab">${t('sw_106')}</span><span class="val mono" id="tlab" style="width:62px">${Math.ceil(ms/60000)} ${t('sw_107')}</span>
     <div class="tbar"><div class="tfill${ms<5*60000?' hot':ms<10*60000?' warn':''}" id="tfill" style="width:${ms/(30*60000)*100}%"></div></div></div>
   <div class="trow"><span class="lab">${t('sw_108')}</span><span class="val mono" style="width:62px">${V.siteIndex+1} / 3</span>
     <div class="segs">${[0,1,2].map(i=>`<div class="seg ${i<V.siteIndex?'done':i===V.siteIndex?'on':''}"></div>`).join('')}</div></div>
  </div><button class="exit" onclick="if(confirm('${t('sw_193')}')){quitToApp()}">${t('sw_109')}</button></div>
 <div class="stage"><div>
  ${prospect?`<div class="offers">${V.offers.map((m,i)=>offerCard(m,i)).join('')}</div>`:''}
  <div class="poolwrap"><div class="sechead">${t('sw_110')} ${V.pool.length} ${t('sw_111')}</div>
   <div class="pool" style="margin-top:26px">${V.pool.map((m,i)=>pillCard(m,i,!prospect,sel.includes(i))).join('')}</div></div>
 </div><div>
  <div class="panel"><h3>${t('sw_112')} ${V.siteIndex+1} · ${[t('sw_113'),t('sw_114'),t('sw_115')][V.siteIndex]}</h3><div class="body">
   <div class="grp">${t('sw_116')}</div>
   ${ATTRS.map(a=>`<div class="prow"><span class="ico">${icon(ATTR_ICON[a],17)}</span><span class="n">${a}</span><span class="v">${V.site.ranges[a][0]} – ${V.site.ranges[a][1]}</span></div>`).join('')}
   <div class="grp" style="margin-top:10px">${t('sw_117')}</div>
   <div class="prow"><span class="ico">${icon(TRAITS[V.site.desired].ic,17,TRAITS[V.site.desired].c1)}</span><span class="n">${V.site.desired}<br><span class="tag">${t('sw_118')}</span></span></div>
   <div class="prow"><span class="ico">${icon(TRAITS[V.site.undesired].ic,17,TRAITS[V.site.undesired].c1)}</span><span class="n">${V.site.undesired}<br><span class="tag">${t('sw_119')}</span></span></div>
  </div></div>
  ${pv?`<div class="panel" style="margin-top:12px"><h3>${t('sw_120')}</h3><div class="body">
    ${pv.detail.map(d=>`<div class="prow"><span class="ico">${icon(ATTR_ICON[d.attr],17)}</span><span class="n">${d.attr}</span><span class="v ${d.ok?'ok':'bad'}">${d.avg}</span></div>`).join('')}
    <div class="prow"><span class="n">${t('sw_121')}</span><span class="v ${pv.hd&&!pv.hu?'ok':'bad'}">${pv.hd?t('sw_122'):t('sw_123')}${pv.hu?t('sw_124'):''}</span></div>
    <div class="prow" style="border-top:1px solid rgba(255,255,255,.12)"><span class="n">${t('sw_125')}</span><span class="v" style="font-size:22px">${pv.percent}%</span></div>
  </div></div>`:''}
  <div class="panel" style="margin-top:12px"><h3>${t('sw_126')}</h3><div class="body">
   ${V.scores.map((s,i)=>`<div class="prow"><span class="n">${t('sw_127')} ${i+1}</span><span class="v">${s===null?'—':s+'%'}</span></div>`).join('')}
  </div></div>
 </div></div>
 <div class="bottom"><div class="i">i</div><div class="txt">${prospect
   ?`${t('sw_128')} ${V.round+1} ${t('sw_129')}`
   :`${t('sw_130')} ${sel.length} ${t('sw_131')}`}</div>
  ${prospect?`<button class="btn" ${pick===null?'disabled':''} ${t('sw_132')}</button>`
            :`<button class="btn g" ${sel.length===3?'':'disabled'} ${t('sw_133')}</button>`}</div>
 <button class="legend" onclick="modal='legend';render()">${t('sw_134')}</button>`}

function scr_reveal(){
 let h=`<div class="top"><div class="tl"><div class="trow"><span class="lab">${t('sw_135')}</span>
   <div class="tbar"><div class="tfill" style="width:100%"></div></div></div></div>
   <button class="exit" onclick="newGame()">${t('sw_136')}</button><button class="exit" style="margin-left:8px" onclick="quitToApp()">${t('sw_137')}</button></div>
  <div class="hero" style="text-align:center;margin:10px 0 26px"><div class="big">${V.total??0}%</div>
   <div class="dim">${V.scores.map((s,i)=>`${t('sw_138')} ${i+1}: <b style="color:var(--canvas)">${s??0}%</b>${V.siteMs&&V.siteMs[i]!=null?` <span style="opacity:.7">(${hhmm(V.siteMs[i])})</span>`:''}`).join(' &nbsp;·&nbsp; ')}</div>
   ${V.usedMs?`<div class="dim small" style="margin-top:6px">${t('sw_139')} ${hhmm(V.usedMs)} ${t('sw_140')}${
     V.siteMs&&V.siteMs.every(x=>x!=null)&&Math.max(...V.siteMs)>V.usedMs*0.5?` ${t('sw_141')} ${V.siteMs.indexOf(Math.max(...V.siteMs))+1} ${t('sw_142')}`:''}</div>`:''}
   <div class="note" style="max-width:680px;margin:14px auto;text-align:left">${REV[0].levelNote}<br><br><b>${V.adaptMsg||''}</b> ${V.nextLevel?`${t('sw_143')} <b>${L(V.nextLevel)}</b>.`:''}</div></div>`;
 REV.forEach((r,si)=>{
  const V_=r.verdict||{head:'',body:''};
  h+=`<div class="rcard"><h2>${t('sw_144')} ${si+1} — ${r.yourScore?r.yourScore.percent:0}%${r.siteMs?` <span class="dim small">· ${hhmm(r.siteMs)}</span>`:''}</h2>
   <p><b class="${r.verdict&&(r.verdict.kind==='clean')?'ok':(r.verdict&&r.verdict.kind==='notFound'?'bad':'')}">${esc(V_.head)}</b><br>${esc(V_.body)}</p>
   ${r.lost?`<p class="small">${t('sw_145')} <b>${esc(r.lost.took.name)}</b> [${esc(r.lost.took.trait)}${t('sw_146')} <b class="bad">${r.lost.priceTo}</b> ${t('sw_147')}
    <br>${t('sw_148')} <b>${esc(r.lost.should.name)}</b> [${esc(r.lost.should.trait)}${t('sw_149')} <b class="ok">${r.lost.priceFrom}</b></p>`:''}
   ${r.squeeze?`<p class="small">${t('sw_150')} <b>${r.squeeze.round}</b> ${t('sw_151')}
    <b>${esc(r.squeeze.took.name)}</b> ${t('sw_152')} <b>${r.squeeze.to}</b> ${t('sw_153')} <b>${r.squeeze.from}</b>
    (<b>${esc(r.squeeze.better.name)}</b>${t('sw_154')} ${r.bestMoves} ${t('sw_155')}
    <br><span class="dim">${t('sw_156')} ${r.poolCombos}${t('sw_157')}</span></p>`
    :''}
   <div class="dim small" style="margin:10px 0 4px">${t('sw_158')} ${r.poolCombos} ${t('sw_159')}</div>
   <table><tr><th>${t('sw_160')}</th><th>${t('sw_161')}</th><th>${t('sw_162')}</th><th>${t('sw_163')}</th></tr>
   ${r.cost.map(c=>`<tr><td>${c.round}${c.played?'':t('sw_164')}</td>${c.options.map(o=>`<td class="${o.taken?'taken':''}">${esc(o.name)}: ${o.remaining===null?'—':o.remaining}${o.taken?t('sw_165'):''}</td>`).join('')}</tr>`).join('')}</table>
   ${r.yourTrio?`<h3 style="margin:14px 0 4px;font-size:15px">${t('sw_166')} ${r.yourTrio.join(', ')}</h3>
   <table>${r.yourScore.detail.map(d=>`<tr><td>${d.attr}</td><td>${t('sw_167')} ${d.avg}</td><td>${t('sw_168')} ${d.range[0]}–${d.range[1]}</td><td class="${d.ok?'ok':'bad'}">${d.ok?t('sw_169'):t('sw_170')}</td></tr>`).join('')}</table>
   <table><tr><td>${V&&V.site?'':''}${t('sw_171')}</td><td>${t('sw_172')}${r.yourScore.hasDesired?'ok':'bad'}">${r.yourScore.hasDesired?t('sw_173'):t('sw_174')}</b></td>
    <td>${t('sw_175')}${r.yourScore.hasUndesired?'bad':'ok'}">${r.yourScore.hasUndesired?t('sw_176'):t('sw_177')}</b></td>
    <td class="${r.yourScore.hasDesired&&!r.yourScore.hasUndesired?'ok':'bad'}">${r.yourScore.hasDesired&&!r.yourScore.hasUndesired?t('sw_178'):t('sw_179')}</td></tr></table>`:''}
   <h3 style="margin:14px 0 4px;font-size:15px">${t('sw_180')}</h3>
   ${r.possible?`<p class="small">${r.possible} ${r.possible===1?t('sw_181'):t('sw_182')} ${t('sw_183')} ${r.poolCombos} ${t('sw_184')}
     ${r.possibleCore&&r.possibleCore.length?`<br><b>${t('sw_185')}</b> ${r.possibleCore.join(', ')} ${t('sw_186')} ${r.possible}.`:t('sw_187')}<br>
     <span class="dim">${r.spread.map(s=>`${s.attr}${t('sw_188')} ${s.from}–${s.to}`).join(' · ')}</span></p>
   ${r.possibleAll&&r.possibleAll.length?`<table><tr><th>${t('sw_189')}</th><th>${t('sw_190')}</th><th>${t('sw_191')}</th></tr>
     ${r.possibleAll.map((v,i)=>`<tr><td>${i+1}</td><td>${esc(v.names.join(', '))}</td><td>${v.desiredCount}</td></tr>`).join('')}</table>`:''}`
    :`<p class="bad small">${t('sw_192')}</p>`}</div>`});
 return h}

function render(){const app=document.getElementById('app');
 document.body.className = (V&&V.phase!=='done') ? ('d'+(V.siteIndex+1)) : '';
 if(ERR){app.innerHTML=scr_err();return}
 if(modal==='assess'){app.innerHTML=scr_menu()+scr_assess();return}
 if(modal==='tut'){app.innerHTML=scr_menu()+scr_tut();return}
 if(REV){app.innerHTML=scr_reveal();return}
 if(!SID||!V){app.innerHTML=scr_menu();return}
 app.innerHTML=scr_game()+(modal==='legend'?scr_legend():'')}

document.addEventListener('pointerdown',e=>{
 const c=e.target.closest('.ocard,.pill.click'); if(!c)return;
 const r=document.createElement('span'); r.className='ripple';
 const b=c.getBoundingClientRect(); const d=Math.max(b.width,b.height)*1.6;
 r.style.width=r.style.height=d+'px'; r.style.left=(e.clientX-b.left)+'px'; r.style.top=(e.clientY-b.top)+'px';
 if(getComputedStyle(c).position==='static')c.style.position='relative';
 c.appendChild(r); setTimeout(()=>r.remove(),560);
},{passive:true});
(function(){const n=document.getElementById('snow');if(!n)return;let s='';
 for(let i=0;i<46;i++){const sz=(1+Math.random()*3.4).toFixed(1),d=(26+Math.random()*46).toFixed(0),dl=(-Math.random()*60).toFixed(0);
  s+=`<span style="left:${(Math.random()*100).toFixed(1)}%;width:${sz}px;height:${sz}px;animation-duration:${d}s;animation-delay:${dl}s;opacity:${(.25+Math.random()*.6).toFixed(2)}"></span>`}
 n.innerHTML=s})();
boot();
</script></body></html>
