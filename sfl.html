<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sustainable Futures Lab · CasEdge</title>
<style>
:root{
  --bg:#0a1512; --bg2:#0e1c18; --ink:#e8f1ee; --dim:#93a8a2; --line:rgba(255,255,255,.10);
  --acc:#4fb28a; --acc2:#7fd0ad; --warn:#d8a53c; --bad:#d9705f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(1200px 700px at 20% -10%,#122a24 0%,transparent 60%),var(--bg);
  color:var(--ink);font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
   radial-gradient(900px 520px at 78% 8%,rgba(79,178,138,.16),transparent 60%),
   radial-gradient(700px 500px at 12% 92%,rgba(45,110,140,.16),transparent 62%),
   linear-gradient(180deg,#0a1512 0%,#0b1a17 55%,#091311 100%)}
#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>")}
#app{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:26px 22px 60px}
.brand{letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--dim)}
h1{font-size:34px;line-height:1.15;margin:10px 0 8px;font-weight:650;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 8px;font-weight:620}
h3{font-size:14px;margin:16px 0 6px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
p{margin:0 0 12px}
.lead{color:#cfdfd9;font-size:16px}
.dim{color:var(--dim)}
.small{font-size:13px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:14px 0;
  box-shadow:0 18px 40px rgba(0,0,0,.32)}
.btn{appearance:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);
  color:var(--ink);padding:11px 22px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
  transition:.16s background,.16s border-color,.16s transform}
.btn:hover:not(:disabled){background:rgba(255,255,255,.1)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.g{background:linear-gradient(180deg,var(--acc),#3d9271);border-color:transparent;color:#05201a;font-weight:640}
.btn.g:hover:not(:disabled){background:linear-gradient(180deg,var(--acc2),#47a37e)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;
  padding:12px 0 14px;margin-bottom:6px;background:linear-gradient(180deg,rgba(10,21,18,.96),rgba(10,21,18,.72),transparent)}
.chip{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.tbar{flex:1;height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.tfill{height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .4s}
.tfill.warn{background:linear-gradient(90deg,#c9a13f,#e0be62)}
.tfill.hot{background:linear-gradient(90deg,#c2554a,#d9705f)}
.mono{font-variant-numeric:tabular-nums}
/* ---- ранжирование ---- */
.rank{list-style:none;margin:10px 0 0;padding:0}
.rank li{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.045);
  border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:9px;cursor:grab;
  transition:.14s border-color,.14s background,.14s transform}
.rank li:hover{border-color:rgba(79,178,138,.5)}
.rank li.drag{opacity:.35}
.rank li.over{border-color:var(--acc);background:rgba(79,178,138,.12)}
.rank .num{width:26px;height:26px;flex:none;border-radius:8px;background:rgba(255,255,255,.08);
  display:grid;place-items:center;font-size:12px;color:var(--dim)}
.rank .txt{flex:1}
.rank .mv{display:flex;flex-direction:column;gap:3px}
.rank .mv button{width:24px;height:20px;border-radius:6px;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:var(--dim);cursor:pointer;font-size:10px;line-height:1;padding:0}
.rank .mv button:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
/* ---- варианты ---- */
.opt{display:flex;gap:13px;align-items:flex-start;background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:12px;padding:15px 16px;margin-bottom:10px;cursor:pointer;
  transition:.14s border-color,.14s background}
.opt:hover{border-color:rgba(79,178,138,.45);background:rgba(255,255,255,.06)}
.opt.on{border-color:var(--acc);background:rgba(79,178,138,.13)}
.opt .dot{width:18px;height:18px;flex:none;margin-top:2px;border-radius:50%;border:2px solid rgba(255,255,255,.28)}
.opt.on .dot{border-color:var(--acc);box-shadow:inset 0 0 0 4px var(--acc)}
/* ---- итог ---- */
.big{font-size:52px;font-weight:680;letter-spacing:-.02em;line-height:1}
.trow{display:flex;align-items:center;gap:12px;margin:8px 0}
.trow .n{flex:1}
.meter{width:190px;height:7px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.meter i.low{background:linear-gradient(90deg,#c2554a,#d9705f)}
.meter i.mid{background:linear-gradient(90deg,#c9a13f,#e0be62)}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
td,th{padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.07);text-align:left;vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.07em}
.ok{color:var(--acc2)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.note{border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:8px;
  padding:12px 14px;background:rgba(255,255,255,.03);font-size:14px}
.note.w{border-left-color:var(--warn)}

/* ══════════ SFL · «полевая станция» ═══════════════════════════════════════
   Костяк взят у симулятора PrepMatter (смотрел их экран 15.08): среда фоном,
   поверх неё стеклянная тёмная панель, сдержанный акцент, ярлык версии сверху.
   СВОЁ вместо их фото: генеративные горизонтали рельефа + два световых пятна,
   у панелей угловые засечки как у полевого журнала, числа моноширинные,
   ярлык фазы печатной лентой. Фото чужие не тащим - и не нужно. */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(178deg, rgba(255,255,255,.030) 0 1px, transparent 1px 46px),
    repeating-linear-gradient(92deg, rgba(255,255,255,.018) 0 1px, transparent 1px 120px),
    radial-gradient(760px 420px at 88% 8%, rgba(79,178,138,.10), transparent 62%),
    radial-gradient(620px 380px at 6% 92%, rgba(201,161,63,.07), transparent 60%);
  mask-image:linear-gradient(180deg, rgba(0,0,0,.85), rgba(0,0,0,.35) 55%, rgba(0,0,0,.75));
}
.wrap, .card, .top, header, main{position:relative;z-index:1}
/* панель полевого журнала: угловые засечки, а не просто рамка */
.card{
  border-radius:14px;
  box-shadow:0 24px 60px rgba(0,0,0,.38), inset 0 1px 0 rgba(255,255,255,.06);
  position:relative;
}
.card::before, .card::after{
  content:'';position:absolute;width:16px;height:16px;pointer-events:none;opacity:.55;
  border-color:var(--acc);border-style:solid;
}
.card::before{top:-1px;left:-1px;border-width:1px 0 0 1px;border-top-left-radius:14px}
.card::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0;border-bottom-right-radius:14px}
/* числа печатной машинкой: величины читаются как замер, а не как текст */
.meter + span, .rank .num, .tnum, [data-num], .val, .num-out{
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
/* ярлык фазы лентой */
.phase-tag{
  display:inline-block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:3px 10px;border-radius:3px;background:rgba(201,161,63,.16);
  color:#e2c778;border:1px solid rgba(201,161,63,.35);
}

</style></head>
<body><div id="bgfx"></div><div id="grain"></div><div id="app"></div>
<script>
const PID='p'+Math.random().toString(36).slice(2,10);
/* НЕПРОЗРАЧНЫЙ КОНВЕРТ СОСТОЯНИЯ. Клиент не знает, что внутри, и возвращает серверу
   всё, что тот прислал: сегодня это `sid`, после порта в `api/` — подписанный токен,
   а если однажды заведём KV — ещё одно поле рядом. Тогда правка будет серверной,
   а клиент останется как есть.
   Dev просил положить пустое поле `sid` заранее. Кладу вместо него пропуск ЛЮБЫХ
   объявленных полей: пустое поле, которое никто не читает и ни один гейт не проверяет,
   через два круга становится мусором, про который никто не помнит, зачем он. */
const CARRY=['sid','token','st'];
let STATE={};
const keep=j=>{ if(j&&typeof j==='object') for(const k of CARRY) if(k in j&&j[k]!=null) STATE[k]=j[k]; return j };
const qs=extra=>{ const p=CARRY.filter(k=>STATE[k]!=null).map(k=>k+'='+encodeURIComponent(STATE[k]));
                  if(extra)p.push(extra); return p.length?'?'+p.join('&'):'' };
const forget=()=>{ STATE={}; SID=null; DEADLINE=null; clearInterval(tick); };
let ERR=null,ERRCODE=null,SID=null,V=null,PROF=null,INTRO=null,introStep=0,REV=null,pick=null,order=null,dragged=false,tick=null,busy=false,CONS=null,DEADLINE=null;

/* ТРАНСПОРТ ПОД VERCEL. Цеховой сервер — это шесть REST-путей с query-строкой;
   в Vercel один файл в `api/` — это одна функция, поэтому наружу торчит ОДИН
   POST `/api/sfl-session`, а бывший путь едет полем `action`. Так же устроен
   Sea Wolf, и по той же причине.
   Экраны, разметка и логика игры НЕ ТРОНУТЫ: подменён только этот слой, а
   `GET`/`POST` оставлены с прежними сигнатурами, чтобы вызовы ниже не менялись.
   Конверт цеха (`CARRY`/`keep`) работает как был: сервер кладёт `token`,
   клиент возвращает ПОСЛЕДНИЙ выданный. */
const SFL_API='/api/sfl-session';
/* Профиль (что уже играл) на сервере больше не живёт: функция не переживает
   вызов. Он лежит здесь и приходит в запросе. Ключа он не несёт — худшее, что
   даёт правка, это выбрать себе другой сценарий, а это и так кнопка. */
const PKEY='casedge_sfl_profile';
function prof(){ try{ return JSON.parse(localStorage.getItem(PKEY)||'{}') }catch(e){ return {} } }
function profSave(p){ try{ localStorage.setItem(PKEY,JSON.stringify(p)) }catch(e){} }
function seenIds(){ const p=prof(); return Array.isArray(p.seen)?p.seen:[] }

/* Токен доступа берём У РОДИТЕЛЬСКОЙ СТРАНИЦЫ, как это делает Sea Wolf
   (`seawolf.html:471`). Игра живёт в same-origin iframe внутри index.html,
   сессия Supabase одна на приложение, и второй копии авторизации тут быть
   не должно. Первая редакция этого файла звала `sb.auth.getSession()` — а `sb`
   в документе игры не существует вовсе: запрос уходил бы без заголовка и
   возвращал 401 на КАЖДЫЙ ход, молча, потому что catch отдавал null. */
async function bearer(){
  try{
    if(window.parent&&window.parent!==window&&typeof window.parent.swAuthToken==='function')
      return await window.parent.swAuthToken();
  }catch(e){}
  return null;
}
async function call(action,extra){
  const h={'content-type':'application/json'};
  const tk=await bearer(); if(tk) h['Authorization']='Bearer '+tk;
  const body=Object.assign({action,seenIds:seenIds()},STATE.token?{token:STATE.token}:{},extra||{});
  const r=await fetch(SFL_API,{method:'POST',headers:h,body:JSON.stringify(body)});
  let j=null; try{ j=await r.json() }catch(e){ throw new Error('сервер ответил не JSON ('+r.status+')') }
  /* Ошибка приходит объектом {error:{message}}, а не строкой: прежний клиент
     печатал бы «[object Object]». */
  if(r.status===401) throw new Error('Сессия не найдена. Войди в аккаунт CasEdge и открой игру заново.');
  if(r.status===429) throw new Error('Слишком много запросов подряд. Подожди минуту и повтори ход — состояние партии хранится у тебя, оно не потеряно.');
  /* Код отказа едет вместе с текстом: экран ошибки обязан отличать «нет прав»
     от «сервер потерян» — иначе кандидат читает отказ по оплате как поломку. */
  if(j&&j.error){ const e=new Error((j.error&&j.error.message)||String(j.error)); e.code=(j.error&&j.error.code)||null; throw e; }
  if(!r.ok) throw new Error('сервер ответил '+r.status);
  return keep(j);
}
/* Прежние сигнатуры сохранены. Путь превращается в action, query игнорируется —
   всё, что она возила, теперь едет в теле. */
const ACT=p=>String(p).replace(/^\//,'').split('?')[0];
async function GET(p,q){
  const a=ACT(p), j=await call(a);
  if(a==='reveal') return j.reveal||j;
  if(a==='view')   return j.view||j;
  /* 13.08.2026. Фраза «все N сценариев пройдены» жила в профиле кандидата и
     пережила рост банка с семи сценариев до двадцати: экран говорил «все семь
     пройдены», когда непройденных было семнадцать. Состояние сервера в клиентском
     профиле не хранится — оно считается заново по ТЕКУЩЕМУ числу сценариев. */
  if(a==='state')  { const pr=prof(); const seen=new Set(pr.seen||[]).size; const total=Number(j.scenarios)||0;
                     const done=total>0&&seen>=total;
                     return Object.assign({},j,{played:(pr.history||[]).length,
                       best:(pr.history||[]).length?Math.max.apply(null,pr.history):null,
                       exhausted:done?`Все ${total} сценариев пройдены. Дальше второй круг: сценарии те же, но решения ты уже принимал.`:null}); }
  return j;
}
async function POST(p,q,b){
  const a=ACT(p), j=await call(a,b||{});
  if(a==='start'){
    const pr=prof(); pr.seen=(pr.seen||[]).concat([j.scenarioId]).slice(-50); delete pr.exhausted;
    profSave(pr);
    return j;                                   // {token, intro, view, …} — как раньше
  }
  if(a==='answer'){ const v=Object.assign({},j.view||{},{consequence:j.consequence||null}); return v; }
  if(a==='begin')  return j.view||j;
  return j;
}
async function act(fn){ if(busy)return; busy=true; ERR=null; ERRCODE=null;
  try{ await fn() }catch(e){ ERR=e.message||String(e); ERRCODE=e.code||null; clearInterval(tick) }
  finally{ busy=false; render() } }
const mmss=ms=>Math.floor(ms/60000)+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0');
const hhmm=ms=>Math.floor(ms/60000)+' мин '+String(Math.floor(ms%60000/1000)).padStart(2,'0')+' с';

function boot(){ return act(async()=>{ PROF=await GET('/state','?pid='+PID) }) }
function start(){ return act(async()=>{
  const r=await POST('/start','',{pid:PID});
  SID=STATE.sid||STATE.token||null; INTRO=r.intro; introStep=0; V=r.view; REV=null; CONS=null; pick=null; dragged=false;
  order=V.items?V.items.map(x=>x.id):null; clearInterval(tick);
})}
function beginQuestions(){ return act(async()=>{ V=await POST('/begin',qs(),{}); INTRO=null;
  syncDeadline(); clearInterval(tick); tick=setInterval(clock,1000); }) }
/* Дедлайн ставится по msLeft, который пришёл ОТ СЕРВЕРА, и пересчитывается на
   каждом ответе. Подкрутить часы у себя можно, но это ничего не даёт: сервер
   считает время по t0 внутри подписанного токена и режет ход сам. */
function syncDeadline(){ if(V&&typeof V.msLeft==='number') DEADLINE=Date.now()+V.msLeft; }
function clock(){
  if(!V||V.phase==='done'||DEADLINE===null)return;
  V.msLeft=Math.max(0,DEADLINE-Date.now());
  if(V.msLeft===0){ clearInterval(tick);
    /* Ноль на часах — единственный случай, когда клиент спрашивает сервер сам:
       партию закрывает он, и разбор берётся у него же. */
    act(async()=>{ const v=await GET('/view',qs()); V=v;
      if(v.phase==='done'){ await loadReveal(); } });
    return }
  paintTimer(); }
function answer(){ return act(async()=>{
  const payload=V.type==='rank'?order:pick;
  if(payload===null||payload===undefined)return;
  const r=await POST('/answer',qs(),{answer:payload});
  CONS=r.consequence||null; V=r; pick=null; dragged=false; syncDeadline();
  order=V.items?V.items.map(x=>x.id):null;
  if(V.phase==='done'){ clearInterval(tick); await loadReveal(); }
})}
async function loadReveal(){ REV=await GET('/reveal',qs());
  /* Историю писал сервер (`player(pid).history`), а его больше нет. Пишем здесь,
     ровно один раз на партию: ключ — токен, второй reveal того же токена
     не должен удваивать запись. */
  try{ const pr=prof(); pr.history=(pr.history||[]);
       if(pr.lastTok!==STATE.token){ pr.history.push(REV.overall); pr.lastTok=STATE.token; profSave(pr); } }catch(e){}
  PROF=await GET('/state','?pid='+PID); CONS=null }
function paintTimer(){ const f=document.getElementById('tf'),l=document.getElementById('tl'); if(!f||!V)return;
  const ms=V.msLeft,total=20*60000;
  f.style.width=(ms/total*100)+'%'; f.className='tfill'+(ms<3*60000?' hot':ms<7*60000?' warn':'');
  if(l)l.textContent=mmss(ms) }

/* ---------- ранжирование: перетаскивание + стрелки как запасной путь ---------- */
function moveItem(from,to){ if(to<0||to>=order.length)return;
  const [x]=order.splice(from,1); order.splice(to,0,x); dragged=true; render() }
function dragStart(e,i){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(i));
  e.currentTarget.classList.add('drag') }
function dragOver(e){ e.preventDefault(); e.currentTarget.classList.add('over') }
function dragLeave(e){ e.currentTarget.classList.remove('over') }
function drop(e,to){ e.preventDefault(); e.currentTarget.classList.remove('over');
  const from=Number(e.dataTransfer.getData('text/plain'));
  if(!Number.isInteger(from)||from===to)return; moveItem(from,to) }

/* ================= экраны ================= */
function scr_menu(){ const p=PROF||{};
 return `<div class="brand">CasEdge · McKinsey Solve</div>
  <h1>Sustainable Futures Lab</h1>
  <p class="lead">Тринадцать решений подряд по одному сценарию. Правильного ответа нет ни у одного:
   измеряется линия — очерёдность, соразмерность реакции и то, держишься ли ты своего порядка,
   когда сценарий давит.</p>
  ${p.exhausted?`<div class="note w" style="margin:16px 0">${p.exhausted}</div>`:''}
  <div class="card">
   <h2>Как это устроено</h2>
   <p class="small dim">Один таймер на 20 минут · первый шаг — порядок приоритетов · дальше выбор из 2–4 ·
    назад вернуться нельзя · после каждого ответа виден его разбор, а баллы — только в конце.</p>
   <p class="small dim" style="margin:0">Пропущенный шаг считается нулём, а не исключается из счёта:
    незакрытое решение — это тоже решение.</p>
  </div>
  <div class="trow"><div class="n">
    <button class="btn g" onclick="start()">${p.played?'Следующий сценарий':'Начать'}</button></div>
   <span class="chip">сценариев ${p.scenarios||0}</span>
   ${p.played?`<span class="chip">пройдено ${p.played} · лучший ${p.best}/10</span>`:''}
  </div>`}

function scr_intro(){ const s=INTRO[introStep], last=introStep===INTRO.length-1;
 return `<div class="bar"><span class="chip">Таймер на паузе</span>
   <div class="tbar"><div class="tfill" style="width:100%"></div></div>
   <span class="chip mono">20:00</span></div>
  <div class="card"><div class="brand">${last?'Задание':'Введение'} · ${V.title}</div>
   <h1 style="font-size:26px">${s.head}</h1>
   <p class="lead">${s.body}</p>
   ${s.mission?`<div class="note">${s.mission}</div>`:''}
  </div>
  <div class="trow"><div class="n dim small">Экран ${introStep+1} из ${INTRO.length}. Таймер пойдёт после этого экрана.</div>
   ${introStep>0?`<button class="btn" onclick="introStep--;render()">Назад</button>`:''}
   <button class="btn g" onclick="${last?'beginQuestions()':'introStep++;render()'}">${last?'Начать — таймер пойдёт':'Дальше'}</button>
  </div>`}

function scr_q(){
 const ms=V.msLeft;
 let h=`<div class="bar"><span class="chip">Вопрос ${V.n} / ${V.of}</span>
   <span class="chip" id="sctitle">${V.title}</span>
   <div class="tbar"><div class="tfill${ms<3*60000?' hot':ms<7*60000?' warn':''}" id="tf" style="width:${ms/(20*60000)*100}%"></div></div>
   <span class="chip mono" id="tl">${mmss(ms)}</span></div>`;
 if(CONS) h+=`<div class="note" style="margin-bottom:14px"><b>Последствие предыдущего решения.</b><br>${CONS}</div>`;
 h+=`<div class="card"><p class="lead">${V.prompt}</p>`;
 if(V.type==='rank'){
   h+=`<ul class="rank">${order.map((id,i)=>{
     const it=V.items.find(x=>x.id===id);
     return `<li draggable="true" data-i="${i}"
        ondragstart="dragStart(event,${i})" ondragend="this.classList.remove('drag')"
        ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,${i})">
       <span class="num">${i+1}</span><span class="txt">${it.label}</span>
       <span class="mv"><button title="выше" onclick="moveItem(${i},${i-1})">▲</button>
        <button title="ниже" onclick="moveItem(${i},${i+1})">▼</button></span></li>`}).join('')}</ul>
     <p class="small dim" style="margin-top:10px">Перетащи пункты или подвинь стрелками. Порядок по умолчанию — не ответ:
      кнопка откроется, когда ты сам расставишь приоритеты.</p>`;
 } else {
   h+=V.options.map(o=>`<div class="opt${pick===o.id?' on':''}" onclick="pick='${o.id}';render()">
      <span class="dot"></span><span>${o.text}</span></div>`).join('');
 }
 h+=`</div><div class="trow"><div class="n dim small">Назад вернуться нельзя — как на реальном ассессменте.</div>
   <button class="btn g" id="go" ${((V.type==='rank'&&!dragged)||(V.type!=='rank'&&pick===null))?'disabled':''}
     onclick="answer()">${V.n===V.of?'Завершить':'Дальше'}</button></div>`;
 return h}

function scr_rev(){
 const R=REV, c=R.consistency;
 const cls=v=>v>=7?'':v>=4?'mid':'low';
 let h=`<div class="brand">Результат</div>
  <div class="trow" style="align-items:flex-end;gap:20px;margin:6px 0 18px">
    <div><div class="big">${R.overall}<span style="font-size:22px;color:var(--dim)">/10</span></div></div>
    <div class="n dim small">Пропущено шагов: <b class="${R.skipped?'bad':'ok'}">${R.skipped}</b> ·
      потрачено ${hhmm(R.usedMs)} из 20 мин</div>
    <button class="btn" onclick="forget();V=null;REV=null;boot()">Ещё сценарий</button>
  </div>
  <div class="card"><h2>Пять признаков</h2>
   ${R.traits.map(t=>`<div class="trow"><span class="n">${t.trait} <span class="dim small">· ${t.steps} шага</span></span>
     <div class="meter"><i class="${cls(t.score||0)}" style="width:${(t.score||0)*10}%"></i></div>
     <span class="mono" style="width:42px;text-align:right">${t.score===null?'—':t.score}</span></div>`).join('')}
   <p class="small dim" style="margin-top:12px">Слабее всего: <b>${R.weakest.map(w=>w.trait+' '+w.score).join('</b> · <b>')}</b></p>
   ${(()=>{const hit=R.steps.filter(s=>s.best&&s.best.mine).length;
     return `<div class="note" style="margin-top:10px">Сильный ход выбран на <b>${hit}</b> шагах из ${R.steps.length}.
      ${hit>=11?'Линия почти безупречна — дальше только скорость.'
       :hit>=7?'Половина шагов взята сильно: смотри ниже, где именно ты уступал, — по этим шагам виден тип ошибки, а не случайность.'
       :'Меньше половины: разбор ниже читай не как оценку, а как список решений, которые надо уметь принимать быстро.'}</div>`})()}
  </div>`;
 if(c){
  /* alignment null — это НЕ ноль и не сто. Метрика при отсутствии сравнимых пар выдавала
     максимум, и «Согласованность 100% · ты играл ровно так, как объявил» получал тот,
     кто не играл вовсе. Отсутствие свидетельств называется словами. */
  const hasNum = typeof c.alignment === 'number';
  h+=`<div class="card"><h2>Линия: что ты объявил и как играл</h2>
   <p class="small dim">На первом шаге ты сам расставил приоритеты. Дальше каждый шаг относился к одному из них —
    ниже видно, где слово и дело разошлись.</p>
   ${c.rows.length?`<table><tr><th>объявлен</th><th>приоритет</th><th>шагов</th><th>сила игры</th></tr>
   ${c.rows.map(r=>`<tr><td class="mono">${r.declaredRank}</td><td>${r.label}</td><td class="mono">${r.steps}</td>
     <td class="mono ${r.avgShare>=0.7?'ok':r.avgShare<=0.35?'bad':'warn'}">${Math.round(r.avgShare*100)}%</td></tr>`).join('')}</table>`:''}
   <div class="note ${hasNum&&c.alignment>=0.7?'':'w'}" style="margin-top:10px">
     ${hasNum
       ? `Согласованность <b>${Math.round(c.alignment*100)}%</b> · расхождений ${c.driftPairs} из ${c.pairs} сравнимых пар.
          ${c.alignment>=0.99?'Ты играл ровно так, как объявил.':
            c.alignment>=0.5?'Линия в целом держится, но на части приоритетов ты сыграл не так, как расставил.':
            'Объявленный порядок и фактическая игра расходятся: либо порядок был не твой, либо давление сценария оказалось сильнее линии.'}`
       : `<b>Согласованность не измеряется.</b> ${c.note||''}`}
   </div></div>`;
 }
 h+=`<div class="card"><h2>Шаг за шагом</h2>
  <p class="small dim">Под каждым шагом — сильный ход и почему он сильный. Оценка без образца
   учит чувству вины, а не работе.</p>
  <table><tr><th>шаг</th><th>признак</th><th>твой</th><th>разбор и сильный ход</th><th>время</th></tr>
  ${R.steps.map(s=>`<tr><td class="mono">${s.n}</td><td class="small">${s.trait}</td>
    <td class="mono ${s.skipped?'bad':s.share>=1?'ok':s.share<=0.2?'bad':'warn'}">${s.skipped?'—':Math.round(s.share*100)+'%'}</td>
    <td class="small">${s.feedback||''}
      ${s.best?(s.best.mine
        ? `<br><span class="ok">Это и был сильный ход.</span>`
        : `<br><span class="dim">Сильный ход: <b style="color:var(--acc2)">${s.best.text}</b>${s.best.why?`<br>${s.best.why}`:''}</span>`):''}</td>
    <td class="mono small">${s.ms?Math.round(s.ms/1000)+' с':'—'}</td></tr>`).join('')}
  </table></div>`;
 return h}

function scr_err(){ const paid=ERRCODE==='entitlement_exhausted';
 return `<div class="brand">CasEdge · SFL</div><h1>${paid?'Нужен Game Pass':'Связь с сервером потеряна'}</h1>
  <p class="lead">${ERR}</p>
  <div class="note w">${paid?'Партия не начата и попытка не списана. Открой раздел с тарифами и вернись сюда.':'Модуль живёт на сервере. Если он перезапустился, текущий прогон продолжить нельзя — начни новый.'}</div>
  <p><button class="btn g" style="margin-top:14px" onclick="ERR=null;forget();V=null;REV=null;INTRO=null;boot()">В меню</button></p>`}

function render(){ const a=document.getElementById('app');
 if(ERR)      return void(a.innerHTML=scr_err());
 if(REV)      return void(a.innerHTML=scr_rev());
 if(INTRO)    return void(a.innerHTML=scr_intro());
 if(SID&&V)   return void(a.innerHTML=scr_q());
 a.innerHTML=scr_menu() }
boot();
</script></body></html>
