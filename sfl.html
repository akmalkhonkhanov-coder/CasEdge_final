<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sustainable Futures Lab · CasEdge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   SFL · визуальная система по артбордам круга дизайна (02.09.2026)
   03.09.2026, dev. Взято из исходников артбордов SflIntro/SflRank/SflChoice/
   SflConsequence/SflResult, извлечённых из артефакта, а не подобрано на глаз:
     страница  #faf9f5 · текст #3d3d3a · заголовки #141413 · Newsreader/Inter/JetBrains
     карточка  белая, радиус 14, рамка 1.5px #e6dfd8, двойная мягкая тень
     акцент    #5db8a6, кнопка 56px, радиус 10, тень rgba(93,184,166,.28)
     подпись   .lab — 13px, +.09em, uppercase, #8e8b82
     часы      мокко-янтарный #b8771f моноширинным
     ПОЛОСА ВЕРДИКТА  тёмная #181715 с белым Newsreader — приём артборда
                      SflConsequence: светлая страница, тёмная полоса сверху
   РАЗМЕТКА И ЛОГИКА НЕ ТРОНУТЫ. Ни одного имени класса не переименовано,
   ни один id, обработчик и ключ словаря не изменён - вся правка в стилях.
   Тёмная тема сохранена целиком под [data-theme="dark"]: переключается атрибутом,
   ничего не потеряно, решение владельца по теме от этого не зависит.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  /* палитра сайта, значения из :root боевого index.html */
  --canvas:#faf9f5; --soft:#f5f0e8; --card-bg:#ffffff; --cream:#efe9de;
  --hair:#e6dfd8; --hair-soft:#efeae3;
  --ink:#141413; --body-ink:#3d3d3a; --muted:#6c6a64; --faint:#8e8b82;
  --dark:#181715; --on-dark:#ffffff; --on-dark-soft:#b7c9c4;
  /* фирменный токен: имя, которое проверяет gate_games_brand — цвет игры
     обязан равняться --coral сайта, и равенство проверяется по этому имени */
  --site-coral:#5db8a6; --site-coral-active:#3f8f7e;
  --acc:var(--site-coral); --acc2:var(--site-coral-active); --acc-wash:rgba(93,184,166,.13);
  --warn:#e8a55a; --warn-ink:#b8771f; --bad:#c64545;
  --shadow:0 1px 2px rgba(20,20,19,.05), 0 12px 32px rgba(20,20,19,.07);
  --shadow-acc:0 8px 24px rgba(93,184,166,.28);
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --font-sans:'Inter',ui-sans-serif,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  /* совместимость: имена, на которые смотрит остальной файл */
  --bg:var(--canvas); --bg2:var(--soft); --dim:var(--muted); --line:var(--hair);
}
[data-theme="dark"]{
  --canvas:#0a1512; --soft:#0e1c18; --card-bg:rgba(255,255,255,.045); --cream:#0e1c18;
  --hair:rgba(255,255,255,.10); --hair-soft:rgba(255,255,255,.07);
  --ink:#e8f1ee; --body-ink:#e8f1ee; --muted:#93a8a2; --faint:#7f978f;
  --dark:#05100d; --on-dark:#e8f1ee; --on-dark-soft:#93a8a2;
  --warn-ink:#e8a55a;
  --shadow:0 18px 40px rgba(0,0,0,.32);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--canvas);color:var(--body-ink);
  font:400 16px/1.6 var(--font-sans);-webkit-font-smoothing:antialiased}
#bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(760px 420px at 88% 6%,var(--acc-wash),transparent 62%),
             radial-gradient(620px 380px at 4% 94%,rgba(232,165,90,.07),transparent 60%)}
#grain{display:none}
#app{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:32px 28px 72px}

h1,h2{font-family:var(--font-display);font-weight:500;letter-spacing:-.01em;color:var(--ink);margin:0}
h1{font-size:34px;line-height:1.25;margin:8px 0 10px}
h2{font-size:24px;line-height:1.25;margin:0 0 10px}
p{margin:0 0 12px}
.lead{font-size:17px;line-height:1.7;color:var(--body-ink)}
.dim{color:var(--muted)}
.small{font-size:14px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums lining-nums}
/* .lab артборда — тем же начертанием, что «brand» в разметке */
.brand{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}

/* ── карточка: белая, рамка, двойная мягкая тень ───────────────────────────── */
.card{background:var(--card-bg);border:1.5px solid var(--hair);border-radius:16px;
  padding:26px 30px;margin:18px 0;box-shadow:var(--shadow)}
.card h2{margin-bottom:6px}

/* ── шапка партии: имя · сценарий · номер вопроса · часы ───────────────────── */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 0 16px;margin-bottom:10px;background:linear-gradient(180deg,var(--canvas) 68%,transparent)}
.chip{font-size:13px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
  color:var(--acc2);border:0;padding:0}
.chip#sctitle{letter-spacing:0;text-transform:none;font-weight:400;font-size:16px;color:var(--muted)}
.tbar{flex:1;min-width:120px;height:3px;background:var(--hair);border-radius:99px;overflow:hidden}
.tfill{height:100%;background:var(--acc);transition:width .4s}
.tfill.warn{background:var(--warn)} .tfill.hot{background:var(--bad)}
.chip.mono{font-size:16px;font-weight:600;color:var(--warn-ink);letter-spacing:0;text-transform:none}

/* ── кнопки: .btn g — главная 56px по артборду, .btn — светлая вторая ──────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:52px;
  padding:0 26px;border-radius:10px;border:1.5px solid var(--hair);background:var(--card-bg);
  color:var(--ink);font:600 16px/1 var(--font-sans);cursor:pointer;
  transition:border-color .16s,background .16s,transform .12s}
.btn:hover:not(:disabled){border-color:var(--acc)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.g{height:56px;padding:0 32px;background:var(--acc);border-color:transparent;
  color:#fff;font-size:17px;box-shadow:var(--shadow-acc)}
.btn.g:hover:not(:disabled){background:var(--acc2)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

.trow{display:flex;align-items:center;gap:14px;margin:14px 0;flex-wrap:wrap}
.trow .n{flex:1;min-width:180px}

/* ── ранжирование: белые строки с ручкой-точками и номером ─────────────────── */
.rank{list-style:none;margin:14px 0 0;padding:0}
.rank li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:18px;align-items:center;
  background:var(--card-bg);border:1.5px solid var(--hair);border-radius:14px;
  padding:18px 22px;margin-bottom:12px;cursor:grab;box-shadow:var(--shadow);
  transition:border-color .14s,box-shadow .14s,transform .1s}
.rank li:hover{border-color:var(--acc)}
.rank li.drag{opacity:.4}
.rank li.over{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-wash),var(--shadow)}
.rank .num{width:36px;height:36px;border-radius:10px;background:var(--soft);color:var(--muted);
  display:grid;place-items:center;font:600 15px/1 var(--font-mono)}
.rank .txt{font-size:16px;line-height:1.5;color:var(--ink)}
.rank .mv{display:flex;flex-direction:column;gap:4px}
.rank .mv button{width:28px;height:24px;border-radius:7px;border:1.5px solid var(--hair);
  background:transparent;color:var(--muted);cursor:pointer;font-size:10px;line-height:1;padding:0}
.rank .mv button:hover{color:var(--acc2);border-color:var(--acc)}

/* ── варианты выбора ──────────────────────────────────────────────────────── */
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:16px;align-items:start;
  background:var(--card-bg);border:1.5px solid var(--hair);border-radius:14px;
  padding:16px 20px;margin-bottom:12px;cursor:pointer;box-shadow:var(--shadow);
  font-size:16px;line-height:1.55;color:var(--ink);
  transition:border-color .14s,box-shadow .14s}
.opt:hover{border-color:var(--acc)}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-wash),var(--shadow)}
.opt .dot{width:20px;height:20px;margin-top:2px;border-radius:50%;border:2px solid var(--hair)}
.opt.on .dot{border-color:var(--acc);box-shadow:inset 0 0 0 5px var(--acc)}

/* ── итог ─────────────────────────────────────────────────────────────────── */
.big{font-family:var(--font-display);font-size:56px;font-weight:500;letter-spacing:-.02em;
  line-height:1;color:var(--ink)}
.meter{width:190px;height:8px;background:var(--soft);border-radius:99px;overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--acc)}
.meter i.low{background:var(--bad)} .meter i.mid{background:var(--warn)}

table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
td,th{padding:10px 10px;border-bottom:1px solid var(--hair-soft);text-align:left;vertical-align:top}
th{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600}
.ok{color:var(--acc2)} .bad{color:var(--bad)} .warn{color:var(--warn-ink)}

/* ── ПОЛОСА ВЕРДИКТА · приём артборда SflConsequence ──────────────────────── */
.note{background:var(--dark);color:var(--on-dark);border:0;border-radius:16px;
  padding:24px 28px;font-family:var(--font-display);font-size:22px;line-height:1.4;
  font-weight:500;box-shadow:var(--shadow)}
.note b{font-weight:600}
.note .small,.note.small{font-family:var(--font-sans);font-size:14px;line-height:1.6;
  font-weight:400;color:var(--on-dark-soft)}
.note.w{background:var(--card-bg);color:var(--body-ink);border:1.5px solid var(--hair);
  border-left:4px solid var(--warn);font-family:var(--font-sans);font-size:16px;line-height:1.6;font-weight:400}
.phase-tag{display:inline-block;font-size:13px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;padding:4px 12px;border-radius:6px;background:rgba(232,165,90,.16);
  color:var(--warn-ink);border:1px solid rgba(232,165,90,.35)}

/* ── ЭКРАН РЕЗУЛЬТАТА · по артборду SflResult ──────────────────────────────
   Тёмная полоса-герой с крупным баллом, затем светлые ленты: признаки строками,
   выводы на кремовой ленте, разбор по вопросам карточками (а не таблицей —
   таблица на телефоне нечитаема, а это главный экран продукта). */
.hero{background:var(--dark);color:var(--on-dark);border-radius:20px;
  padding:40px 44px 36px;margin:6px 0 26px;text-align:center;box-shadow:var(--shadow)}
.hero .brand{color:var(--on-dark-soft);margin-bottom:22px}
.hero .lab{font-size:13px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--on-dark-soft);font-weight:600;margin-bottom:12px}
.hero .score{display:flex;align-items:baseline;justify-content:center;gap:8px}
.hero .score .v{font-family:var(--font-display);font-size:104px;line-height:1;
  font-weight:500;letter-spacing:-.02em;color:var(--on-dark)}
.hero .score .of{font-family:var(--font-display);font-size:40px;line-height:1;color:var(--muted)}
.hero .say{font-family:var(--font-display);font-size:21px;line-height:1.45;font-weight:500;
  color:var(--on-dark-soft);max-width:640px;margin:18px auto 0}
.hero .meta{margin-top:22px;display:flex;gap:16px;justify-content:center;align-items:center;
  flex-wrap:wrap;font-size:14px;color:var(--on-dark-soft)}
.hero .btn{background:transparent;border-color:rgba(255,255,255,.22);color:var(--on-dark)}
.hero .btn:hover{border-color:var(--acc)}

.sect{margin:30px 0 8px}
.sect h2{margin-bottom:4px}
.sect .small.dim{margin:0 0 12px}

.trait{display:grid;grid-template-columns:minmax(150px,320px) minmax(0,1fr) 64px;
  gap:24px;align-items:center;height:46px;border-top:1px solid var(--hair)}
.trait:last-of-type{border-bottom:1px solid var(--hair)}
.trait .k{font-size:16px;font-weight:600;color:var(--ink)}
.trait .k .dim{font-weight:400}
.trait .v{font-family:var(--font-mono);font-size:18px;font-weight:600;text-align:right}

.band{background:var(--soft);border-radius:20px;padding:28px 30px;margin:22px 0}
.band h2{margin-bottom:12px}

.qcard{background:var(--card-bg);border:1px solid var(--hair);border-radius:16px;
  padding:18px 24px;margin-bottom:12px;box-shadow:var(--shadow)}
.qcard .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.qcard .no{font-family:var(--font-mono);font-size:15px;font-weight:600;color:var(--faint)}
.qcard .tr{font-size:16px;font-weight:600;color:var(--ink)}
.qcard .sh{font-family:var(--font-mono);font-size:15px;font-weight:600;margin-left:auto}
.qcard .lab{font-size:13px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);font-weight:600;margin:10px 0 4px}
.qcard .fb{font-size:16px;line-height:1.65}
.qcard .best{display:grid;grid-template-columns:8px minmax(0,1fr);gap:14px;align-items:start;
  margin-top:10px;font-size:16px;line-height:1.6}
.qcard .best .b{width:8px;height:8px;border-radius:4px;background:var(--acc);margin-top:9px}
@media (max-width:560px){
  .hero{padding:26px 20px 24px;border-radius:16px}
  .hero .score .v{font-size:68px} .hero .score .of{font-size:28px}
  .hero .say{font-size:18px}
  .trait{grid-template-columns:minmax(0,1fr) 52px;grid-template-areas:"k v" "m m";
    height:auto;padding:12px 0;gap:8px 12px}
  .trait .k{grid-area:k} .trait .v{grid-area:v} .trait .meter{grid-area:m;width:100%}
  .band{padding:20px 16px;border-radius:16px}
  .qcard{padding:14px 15px}
}

/* ── адаптив: в этом клиенте его не было ВООБЩЕ, ноль @media ──────────────── */
@media (max-width:900px){
  #app{padding:22px 18px 56px}
  h1{font-size:28px} h2{font-size:21px} .big{font-size:44px}
  .card{padding:20px 20px;border-radius:14px}
  .meter{width:120px}
  .note{font-size:19px;padding:20px 22px}
}
@media (max-width:560px){
  body{font-size:15px}
  #app{padding:16px 14px 48px}
  h1{font-size:24px;line-height:1.3} .big{font-size:38px}
  .bar{gap:10px;padding:10px 0 12px}
  .chip{font-size:12px} .chip#sctitle{font-size:14px;order:3;flex-basis:100%}
  .tbar{order:4;flex-basis:100%;min-width:0}
  .btn,.btn.g{width:100%;height:50px;font-size:16px;padding:0 18px}
  .trow{gap:10px} .trow .n{min-width:0;flex-basis:100%}
  .rank li{grid-template-columns:30px minmax(0,1fr) auto;gap:12px;padding:14px 14px}
  .rank .num{width:30px;height:30px;font-size:13px}
  .rank .txt{font-size:15px}
  .opt{grid-template-columns:22px minmax(0,1fr);gap:12px;padding:14px 14px;font-size:15px}
  .note{font-size:17px;padding:16px 18px;border-radius:14px}
  table{font-size:13px} td,th{padding:8px 6px}
  .card{padding:16px 15px}
}
</style></head>
<body><div id="bgfx"></div><div id="grain"></div><div id="app"></div>
<script>

let UILANG=(function(){try{const v=localStorage.getItem('caseedge_uilang');return v==='ru'?'ru':'en'}catch(e){return 'en'}})();
/* ЯЗЫК ИГРЫ · решение владельца 02.09.2026, круг 123.
   Настоящий ассессмент MBB идёт по-английски, и тренажёр, который тренирует не на
   языке экзамена, тренирует не то: кандидат теряет доли секунды на переключение
   там, где времени нет. Поэтому ВНУТРИ ПАРТИИ язык принудительно английский,
   независимо от языка сайта.
   РАЗБОР — исключение по решению владельца: он идёт ПОСЛЕ таймера, это не
   испытание, а объяснение, и его язык выбирает клиент. Поэтому в ручку разбора
   уходит UILANG, а не 'en'.
   Замер цеха игр, круг 123: сегодня внутри партии кандидат с русским сайтом видит
   221 кириллический знак в Морском Волке и 159 в SFL. После правки — 0.
   Обе оболочки уже двуязычны (ru 193 / en 193 и ru 76 / en 76, ключей без пары 0),
   поэтому это одна строка, а не перевод. */
const SITE_LANG = UILANG;          /* язык сайта — им ведётся РАЗБОР */
UILANG = 'en';                     /* язык ПАРТИИ — всегда английский */

function t(k){ const d=I18N[UILANG]||I18N.en; return (d&&d[k]!==undefined)?d[k]:(I18N.en[k]!==undefined?I18N.en[k]:k); }
/* Имена уровней — КЛЮЧИ ДАННЫХ (seawolf-games.json хранит level:'Лёгкий').
   Значения не трогаем, переводим только ПЕЧАТЬ. */
const LVL_EN={'Лёгкий':'Easy','Средний':'Medium','Сложный':'Hard','Ассессмент':'Assessment'};
const LV_E='Лёгкий', LV_M='Средний', LV_H='Сложный', LV_A='Ассессмент';
function L(v){ return UILANG==='ru' ? v : (LVL_EN[v]||v); }
try{document.documentElement.lang=SITE_LANG;}catch(e){}
/* @@I18N-DICT-END@@ */

const PID='p'+Math.random().toString(36).slice(2,10);
/* НЕПРОЗРАЧНЫЙ КОНВЕРТ СОСТОЯНИЯ. Клиент не знает, что внутри, и возвращает серверу
   всё, что тот прислал: сегодня это `sid`, после порта в `api/` — подписанный токен,
   а если однажды заведём KV — ещё одно поле рядом. Тогда правка будет серверной,
   а клиент останется как есть.
   Dev просил положить пустое поле `sid` заранее. Кладу вместо него пропуск ЛЮБЫХ
   объявленных полей: пустое поле, которое никто не читает и ни один гейт не проверяет,
   через два круга становится мусором, про который никто не помнит, зачем он. */
const CARRY=['sid','token','st'];
let STATE={};
const keep=j=>{ if(j&&typeof j==='object') for(const k of CARRY) if(k in j&&j[k]!=null) STATE[k]=j[k]; return j };
const qs=extra=>{ const p=CARRY.filter(k=>STATE[k]!=null).map(k=>k+'='+encodeURIComponent(STATE[k]));
                  if(extra)p.push(extra); return p.length?'?'+p.join('&'):'' };
const forget=()=>{ STATE={}; SID=null; DEADLINE=null; clearInterval(tick); };
let ERR=null,ERRCODE=null,SID=null,V=null,PROF=null,INTRO=null,introStep=0,REV=null,pick=null,order=null,dragged=false,tick=null,busy=false,CONS=null,DEADLINE=null;

/* ТРАНСПОРТ ПОД VERCEL. Цеховой сервер — это шесть REST-путей с query-строкой;
   в Vercel один файл в `api/` — это одна функция, поэтому наружу торчит ОДИН
   POST `/api/sfl-session`, а бывший путь едет полем `action`. Так же устроен
   Sea Wolf, и по той же причине.
   Экраны, разметка и логика игры НЕ ТРОНУТЫ: подменён только этот слой, а
   `GET`/`POST` оставлены с прежними сигнатурами, чтобы вызовы ниже не менялись.
   Конверт цеха (`CARRY`/`keep`) работает как был: сервер кладёт `token`,
   клиент возвращает ПОСЛЕДНИЙ выданный. */
const SFL_API='/api/sfl-session';
/* Профиль (что уже играл) на сервере больше не живёт: функция не переживает
   вызов. Он лежит здесь и приходит в запросе. Ключа он не несёт — худшее, что
   даёт правка, это выбрать себе другой сценарий, а это и так кнопка. */
const PKEY='casedge_sfl_profile';
function prof(){ try{ return JSON.parse(localStorage.getItem(PKEY)||'{}') }catch(e){ return {} } }
function profSave(p){ try{ localStorage.setItem(PKEY,JSON.stringify(p)) }catch(e){} }
function seenIds(){ const p=prof(); return Array.isArray(p.seen)?p.seen:[] }

/* Токен доступа берём У РОДИТЕЛЬСКОЙ СТРАНИЦЫ, как это делает Sea Wolf
   (`seawolf.html:471`). Игра живёт в same-origin iframe внутри index.html,
   сессия Supabase одна на приложение, и второй копии авторизации тут быть
   не должно. Первая редакция этого файла звала `sb.auth.getSession()` — а `sb`
   в документе игры не существует вовсе: запрос уходил бы без заголовка и
   возвращал 401 на КАЖДЫЙ ход, молча, потому что catch отдавал null. */
async function bearer(){
  try{
    if(window.parent&&window.parent!==window&&typeof window.parent.swAuthToken==='function')
      return await window.parent.swAuthToken();
  }catch(e){}
  return null;
}
async function call(action,extra){
  const h={'content-type':'application/json'};
  const tk=await bearer(); if(tk) h['Authorization']='Bearer '+tk;
  /* Круг 72, находка dev'а: клиенты игр НЕ СЛАЛИ ЯЗЫК ВООБЩЕ. Сервер брал
     умолчание продукта (английское), и русский кандидат читал английскую
     калибровочную строку внутри русского экрана. Ось языка обязана ДОЕЗЖАТЬ:
     ключ и умолчание те же, что у index.html. */
  const body=Object.assign({action,seenIds:seenIds(),uiLang:(action==='reveal'?SITE_LANG:UILANG)  /* разбор — на языке клиента */},
                           STATE.token?{token:STATE.token}:{},extra||{});
  const r=await fetch(SFL_API,{method:'POST',headers:h,body:JSON.stringify(body)});
  let j=null; try{ j=await r.json() }catch(e){ throw new Error(t('sfl_1')+r.status+')') }
  /* Ошибка приходит объектом {error:{message}}, а не строкой: прежний клиент
     печатал бы «[object Object]». */
  if(r.status===401) throw new Error(t('sfl_2'));
  if(r.status===429) throw new Error(t('sfl_3'));
  /* Код отказа едет вместе с текстом: экран ошибки обязан отличать «нет прав»
     от «сервер потерян» — иначе кандидат читает отказ по оплате как поломку. */
  if(j&&j.error){ const e=new Error((j.error&&j.error.message)||String(j.error)); e.code=(j.error&&j.error.code)||null; throw e; }
  if(!r.ok) throw new Error(t('sfl_4')+r.status);
  return keep(j);
}
/* Прежние сигнатуры сохранены. Путь превращается в action, query игнорируется —
   всё, что она возила, теперь едет в теле. */
/* Текст РУЧКИ печатается сырым, а он бывает размеченным: разбор сильного хода
   доходит до шести абзацев и десяти пар `**…**`. До круга 70 абзацы схлопывались
   в один ком, а звёздочки уезжали кандидату как звёздочки. Находка ревьюера
   круга 70. Экранируем ВСЁ, что пришло с сервера, и разворачиваем ровно две
   разметки — жирное и абзац; тегов в этих полях нет (проверено по 2 170 строкам
   двадцати сценариев), поэтому экранирование ничего не ломает. */
function md(t){
  if(t==null) return '';
  const e=String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
}
const ACT=p=>String(p).replace(/^\//,'').split('?')[0];
async function GET(p,q){
  const a=ACT(p), j=await call(a);
  if(a==='reveal') return j.reveal||j;
  if(a==='view')   return j.view||j;
  /* 13.08.2026. Фраза «все N сценариев пройдены» жила в профиле кандидата и
     пережила рост банка с семи сценариев до двадцати: экран говорил «все семь
     пройдены», когда непройденных было семнадцать. Состояние сервера в клиентском
     профиле не хранится — оно считается заново по ТЕКУЩЕМУ числу сценариев. */
  if(a==='state')  { const pr=prof(); const seen=new Set(pr.seen||[]).size; const total=Number(j.scenarios)||0;
                     const done=total>0&&seen>=total;
                     return Object.assign({},j,{played:(pr.history||[]).length,
                       best:(pr.history||[]).length?Math.max.apply(null,pr.history):null,
                       exhausted:done?`${t('sfl_5')} ${total} ${t('sfl_6')}`:null}); }
  return j;
}
async function POST(p,q,b){
  const a=ACT(p), j=await call(a,b||{});
  if(a==='start'){
    const pr=prof(); pr.seen=(pr.seen||[]).concat([j.scenarioId]).slice(-50); delete pr.exhausted;
    profSave(pr);
    return j;                                   // {token, intro, view, …} — как раньше
  }
  if(a==='answer'){ const v=Object.assign({},j.view||{},{consequence:j.consequence||null}); return v; }
  if(a==='begin')  return j.view||j;
  return j;
}
async function act(fn){ if(busy)return; busy=true; ERR=null; ERRCODE=null;
  try{ await fn() }catch(e){ ERR=e.message||String(e); ERRCODE=e.code||null; clearInterval(tick) }
  finally{ busy=false; render() } }
const mmss=ms=>Math.floor(ms/60000)+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0');
const hhmm=ms=>Math.floor(ms/60000)+t('sfl_7')+String(Math.floor(ms%60000/1000)).padStart(2,'0')+t('sfl_8');

function boot(){ return act(async()=>{ PROF=await GET('/state','?pid='+PID) }) }
function start(){ return act(async()=>{
  const r=await POST('/start','',{pid:PID});
  SID=STATE.sid||STATE.token||null; INTRO=r.intro; introStep=0; V=r.view; REV=null; CONS=null; pick=null; dragged=false;
  order=V.items?V.items.map(x=>x.id):null; clearInterval(tick);
})}
function beginQuestions(){ return act(async()=>{ V=await POST('/begin',qs(),{}); INTRO=null;
  syncDeadline(); clearInterval(tick); tick=setInterval(clock,1000); }) }
/* Дедлайн ставится по msLeft, который пришёл ОТ СЕРВЕРА, и пересчитывается на
   каждом ответе. Подкрутить часы у себя можно, но это ничего не даёт: сервер
   считает время по t0 внутри подписанного токена и режет ход сам. */
function syncDeadline(){ if(V&&typeof V.msLeft==='number') DEADLINE=Date.now()+V.msLeft; }
function clock(){
  if(!V||V.phase==='done'||DEADLINE===null)return;
  V.msLeft=Math.max(0,DEADLINE-Date.now());
  if(V.msLeft===0){ clearInterval(tick);
    /* Ноль на часах — единственный случай, когда клиент спрашивает сервер сам:
       партию закрывает он, и разбор берётся у него же. */
    act(async()=>{ const v=await GET('/view',qs()); V=v;
      if(v.phase==='done'){ await loadReveal(); } });
    return }
  paintTimer(); }
function answer(){ return act(async()=>{
  const payload=V.type==='rank'?order:pick;
  if(payload===null||payload===undefined)return;
  const r=await POST('/answer',qs(),{answer:payload});
  CONS=r.consequence||null; V=r; pick=null; dragged=false; syncDeadline();
  order=V.items?V.items.map(x=>x.id):null;
  if(V.phase==='done'){ clearInterval(tick); await loadReveal(); }
})}
async function loadReveal(){ REV=await GET('/reveal',qs());
  /* Историю писал сервер (`player(pid).history`), а его больше нет. Пишем здесь,
     ровно один раз на партию: ключ — токен, второй reveal того же токена
     не должен удваивать запись. */
  try{ const pr=prof(); pr.history=(pr.history||[]);
       if(pr.lastTok!==STATE.token){ pr.history.push(REV.overall); pr.lastTok=STATE.token; profSave(pr); } }catch(e){}
  PROF=await GET('/state','?pid='+PID); CONS=null }
function paintTimer(){ const f=document.getElementById('tf'),l=document.getElementById('tl'); if(!f||!V)return;
  const ms=V.msLeft,total=20*60000;
  f.style.width=(ms/total*100)+'%'; f.className='tfill'+(ms<3*60000?' hot':ms<7*60000?' warn':'');
  if(l)l.textContent=mmss(ms) }

/* ---------- ранжирование: перетаскивание + стрелки как запасной путь ---------- */
function moveItem(from,to){ if(to<0||to>=order.length)return;
  const [x]=order.splice(from,1); order.splice(to,0,x); dragged=true; render() }
function dragStart(e,i){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',String(i));
  e.currentTarget.classList.add('drag') }
function dragOver(e){ e.preventDefault(); e.currentTarget.classList.add('over') }
function dragLeave(e){ e.currentTarget.classList.remove('over') }
function drop(e,to){ e.preventDefault(); e.currentTarget.classList.remove('over');
  const from=Number(e.dataTransfer.getData('text/plain'));
  if(!Number.isInteger(from)||from===to)return; moveItem(from,to) }

/* ================= экраны ================= */
function scr_menu(){ const p=PROF||{};
 return `<div class="brand">CasEdge · McKinsey Solve</div>
  <h1>Sustainable Futures Lab</h1>
  <p class="lead">${t('sfl_9')}</p>
  ${p.exhausted?`<div class="note w" style="margin:16px 0">${p.exhausted}</div>`:''}
  <div class="card">
   <h2>${t('sfl_10')}</h2>
   <p class="small dim">${t('sfl_11')}</p>
   <p class="small dim" style="margin:0">${t('sfl_12')}</p>
  </div>
  <div class="trow"><div class="n">
    <button class="btn g" onclick="start()">${p.played?t('sfl_13'):t('sfl_14')}</button></div>
   <span class="chip">${t('sfl_15')} ${p.scenarios||0}</span>
   ${(p.played&&p.best!=null)?`<span class="chip">${t('sfl_16')} ${p.played} ${t('sfl_17')} ${p.best}/10</span>`:''}
  </div>`}

function scr_intro(){ const s=INTRO[introStep], last=introStep===INTRO.length-1;
 return `<div class="bar"><span class="chip">${t('sfl_18')}</span>
   <div class="tbar"><div class="tfill" style="width:100%"></div></div>
   <span class="chip mono">20:00</span></div>
  <div class="card"><div class="brand">${last?t('sfl_19'):t('sfl_20')} · ${V.title}</div>
   <h1 style="font-size:26px">${s.head}</h1>
   <p class="lead">${s.body}</p>
   ${s.mission?`<div class="note">${s.mission}</div>`:''}
  </div>
  <div class="trow"><div class="n dim small">${t('sfl_21')} ${introStep+1} ${t('sfl_22')} ${INTRO.length}${t('sfl_23')}</div>
   ${introStep>0?`<button class="btn" onclick="introStep--;render()">${t('sfl_24')}</button>`:''}
   <button class="btn g" onclick="${last?'beginQuestions()':'introStep++;render()'}">${last?t('sfl_25'):t('sfl_26')}</button>
  </div>`}

function scr_q(){
 const ms=V.msLeft;
 let h=`<div class="bar"><span class="chip">${t('sfl_27')} ${V.n} / ${V.of}</span>
   <span class="chip" id="sctitle">${V.title}</span>
   <div class="tbar"><div class="tfill${ms<3*60000?' hot':ms<7*60000?' warn':''}" id="tf" style="width:${ms/(20*60000)*100}%"></div></div>
   <span class="chip mono" id="tl">${mmss(ms)}</span></div>`;
 if(CONS) h+=`<div class="note" style="margin-bottom:14px"><b>${t('sfl_28')}</b><br>${md(CONS)}</div>`;
 h+=`<div class="card"><p class="lead">${V.prompt}</p>`;
 if(V.type==='rank'){
   h+=`<ul class="rank">${order.map((id,i)=>{
     const it=V.items.find(x=>x.id===id);
     return `<li draggable="true" data-i="${i}"
        ondragstart="dragStart(event,${i})" ondragend="this.classList.remove('drag')"
        ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="drop(event,${i})">
       <span class="num">${i+1}</span><span class="txt">${it.label}</span>
       <span class="mv">${t('sfl_29')}${i},${i-1})">▲</button>
        ${t('sfl_30')}${i},${i+1})">▼</button></span></li>`}).join('')}</ul>
     <p class="small dim" style="margin-top:10px">${t('sfl_31')}</p>`;
 } else {
   h+=V.options.map(o=>`<div class="opt${pick===o.id?' on':''}" onclick="pick='${o.id}';render()">
      <span class="dot"></span><span>${o.text}</span></div>`).join('');
 }
 h+=`</div><div class="trow"><div class="n dim small">${t('sfl_32')}</div>
   <button class="btn g" id="go" ${((V.type==='rank'&&!dragged)||(V.type!=='rank'&&pick===null))?'disabled':''}
     onclick="answer()">${V.n===V.of?t('sfl_33'):t('sfl_34')}</button></div>`;
 return h}

function scr_rev(){
 const R=REV, c=R.consistency;
 const cls=v=>v>=7?'':v>=4?'mid':'low';
 const col=v=>v===null?'var(--muted)':v>=7?'var(--acc2)':v>=4?'var(--warn-ink)':'var(--bad)';
 const hit=R.steps.filter(s=>s.best&&s.best.mine).length;
 /* полоса-герой: балл, слабейший признак словами и что это значит.
    Артборд SflResult: тёмная лента, крупный Newsreader, вывод одной фразой. */
 let h=`<div class="hero">
   <div class="brand">${t('sfl_35')}</div>
   <div class="score"><span class="v">${R.overall}</span><span class="of">/10</span></div>
   <div class="say">${t('sfl_42')} ${R.weakest.map(w=>w.trait+' '+w.score).join(' · ')}</div>
   <div class="meta">
     <span>${t('sfl_36')}${R.skipped?'bad':'ok'}">${R.skipped}</b> ${t('sfl_37')} ${hhmm(R.usedMs)} ${t('sfl_38')}</span>
     <button class="btn" onclick="forget();V=null;REV=null;boot()">${t('sfl_39')}</button>
   </div></div>`;
 /* признаки строками с чертой, как в артборде, а не карточкой со списком */
 h+=`<div class="sect"><h2>${t('sfl_40')}</h2></div>
  ${R.traits.map(tr=>`<div class="trait">
     <span class="k">${tr.trait} <span class="dim small">· ${tr.steps} ${t('sfl_41')}</span></span>
     <div class="meter"><i class="${cls(tr.score||0)}" style="width:${(tr.score||0)*10}%"></i></div>
     <span class="v" style="color:${col(tr.score)}">${tr.score===null?'—':tr.score}</span>
   </div>`).join('')}`;
 /* кремовая лента выводов: сколько сильных ходов и что из этого следует */
 h+=`<div class="band"><h2>${t('sfl_67')}</h2>
   <div class="card" style="margin:0">
     <div class="tr" style="font-size:17px;font-weight:600;color:var(--ink)">${t('sfl_43')} <b>${hit}</b> ${t('sfl_44')} ${R.steps.length}</div>
     <div class="fb" style="margin-top:8px">${hit>=11?t('sfl_45'):hit>=7?t('sfl_46'):t('sfl_47')}</div>
   </div></div>`;
 if(c){
  /* alignment null — это НЕ ноль и не сто. Метрика при отсутствии сравнимых пар выдавала
     максимум, и «Согласованность 100% · ты играл ровно так, как объявил» получал тот,
     кто не играл вовсе. Отсутствие свидетельств называется словами. */
  const hasNum = typeof c.alignment === 'number';
  h+=`<div class="sect"><h2>${t('sfl_48')}</h2><p class="small dim">${t('sfl_49')}</p></div>
   <div class="card" style="margin-top:0">
   ${c.rows.length?`<table><tr><th>${t('sfl_50')}</th><th>${t('sfl_51')}</th><th>${t('sfl_52')}</th><th>${t('sfl_53')}</th></tr>
   ${c.rows.map(r=>`<tr><td class="mono">${r.declaredRank}</td><td>${r.label}</td><td class="mono">${r.steps}</td>
     <td class="mono ${r.avgShare>=0.7?'ok':r.avgShare<=0.35?'bad':'warn'}">${Math.round(r.avgShare*100)}%</td></tr>`).join('')}</table>`:''}
   <div class="note ${hasNum&&c.alignment>=0.7?'':'w'}" style="margin-top:10px">
     ${hasNum
       ? `${t('sfl_54')} <b>${Math.round(c.alignment*100)}%</b> ${t('sfl_55')} ${c.driftPairs} ${t('sfl_56')} ${c.pairs} ${t('sfl_57')}
          ${c.alignment>=0.99?t('sfl_58'):
            c.alignment>=0.5?t('sfl_59'):
            t('sfl_60')}`
       : `<b>${t('sfl_61')}</b> ${md(c.note)}`}
   </div></div>`;
 }
 /* разбор по вопросам — карточками. Таблица здесь была нечитаема на телефоне,
    а это главный экран продукта: за него платят, его перечитывают. */
 h+=`<div class="sect"><h2>${t('sfl_62')}</h2><p class="small dim">${t('sfl_63')}</p></div>
  ${R.steps.map(s=>`<div class="qcard">
    <div class="top">
      <span class="no">${t('sfl_64')} ${s.n}</span>
      <span class="tr">${s.trait}</span>
      <span class="sh ${s.skipped?'bad':s.share>=1?'ok':s.share<=0.2?'bad':'warn'}">${s.skipped?'—':Math.round(s.share*100)+'%'}</span>
    </div>
    <div class="lab">${t('sfl_66')} · ${t('sfl_65')} · ${s.ms?Math.round(s.ms/1000)+t('sfl_71'):'—'} ${t('sfl_68')}</div>
    <div class="fb">${md(s.feedback)}</div>
    ${s.best?(s.best.mine
      ? `<div class="best"><span class="b"></span><span class="ok">${t('sfl_69')}</span></div>`
      : `<div class="best"><span class="b"></span><span><b>${t('sfl_70')}</b> ${md(s.best.text)}${s.best.why?`<br><span class="dim">${md(s.best.why)}</span>`:''}</span></div>`):''}
  </div>`).join('')}`;
 return h}

function scr_err(){ const paid=ERRCODE==='entitlement_exhausted';
 return `<div class="brand">CasEdge · SFL</div><h1>${paid?t('sfl_72'):t('sfl_73')}</h1>
  <p class="lead">${ERR}</p>
  <div class="note w">${paid?t('sfl_74'):t('sfl_75')}</div>
  <p><button class="btn g" style="margin-top:14px" onclick="ERR=null;forget();V=null;REV=null;INTRO=null;boot()">${t('sfl_76')}</button></p>`}

function render(){ const a=document.getElementById('app');
 if(ERR)      return void(a.innerHTML=scr_err());
 if(REV)      return void(a.innerHTML=scr_rev());
 if(INTRO)    return void(a.innerHTML=scr_intro());
 if(SID&&V)   return void(a.innerHTML=scr_q());
 a.innerHTML=scr_menu() }
boot();
</script></body></html>
